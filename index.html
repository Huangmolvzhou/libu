<script>
/* js/parse.js */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) { module.exports = factory(); }
  else { root.LB = root.LB || {}; Object.assign(root.LB, factory()); }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const OCCASIONS = ['结婚', '生小孩', '满月酒', '乔迁', '升学', '白事', '其他'];
  const RELATIONS = ['亲戚', '朋友', '同事', '邻居', '同学', '其他'];
  const DIRECTIONS = ['收礼', '送礼'];

  // 礼金量级只需到万；「亿」在这个场景不会出现，多做反而多一处出错机会
  const CN_DIGIT = { '零': 0, '〇': 0, '一': 1, '二': 2, '两': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
  const CN_UNIT = { '十': 10, '百': 100, '千': 1000, '万': 10000 };
  const CN_CHARS = '零〇一二三四五六七八九十百千万两';

  const RE_DIGIT = /[0-9]/;
  const RE_CJK = /[\u4e00-\u9fa5]/;
  const RE_WS = /[ \t\u3000\u00a0]/;

  function round2(v) { return Math.round(v * 100) / 100; }

  // 中文数字：末尾那个裸数字是「下一个低一级单位」的省略写法
  // 一千二 = 1200、三千五 = 3500、一万二 = 12000
  function cnToNumber(str) {
    let total = 0;
    let section = 0;
    let num = -1;
    let lastUnit = 0;
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      if (Object.prototype.hasOwnProperty.call(CN_DIGIT, ch)) { num = CN_DIGIT[ch]; continue; }
      const u = CN_UNIT[ch];
      if (!u) continue;
      if (u >= 10000) {
        if (num >= 0) section += num;
        total += (section || 1) * u;
        section = 0;
        num = -1;
      } else {
        if (num < 0) num = 1;
        section += num * u;
        num = -1;
      }
      lastUnit = u;
    }
    if (num >= 0) section += lastUnit > 1 ? num * (lastUnit / 10) : num;
    return total + section;
  }

  function tokenize(s) {
    const tokens = [];
    let i = 0;
    while (i < s.length) {
      const ch = s[i];
      const prev = tokens.length ? tokens[tokens.length - 1] : null;

      if (RE_WS.test(ch)) {
        const start = i;
        while (i < s.length && RE_WS.test(s[i])) i++;
        tokens.push({ type: 'ws', start: start, end: i, text: s.slice(start, i) });
        continue;
      }

      if (RE_DIGIT.test(ch) || ((ch === '-' || ch === '\uFF0D') && RE_DIGIT.test(s[i + 1] || ''))) {
        const start = i;
        if (ch === '-' || ch === '\uFF0D') i++;
        while (i < s.length && RE_DIGIT.test(s[i])) i++;
        // 千分位逗号只在两侧都是数字时吞掉，「张三,888」里的逗号仍然算分隔符
        while (s[i] === ',' && RE_DIGIT.test(s[i + 1] || '')) {
          i++;
          while (i < s.length && RE_DIGIT.test(s[i])) i++;
        }
        if (s[i] === '.' && RE_DIGIT.test(s[i + 1] || '')) {
          i++;
          while (i < s.length && RE_DIGIT.test(s[i])) i++;
        }
        const raw = s.slice(start, i);
        // 千分位逗号已经吞进 token，parseFloat('1,000') 会只取到 1
        const v = parseFloat(raw.replace(',', '').replace('\uFF0D', '-'));
        tokens.push({ type: 'num', start: start, end: i, text: raw, value: round2(isNaN(v) ? 0 : v) });
        continue;
      }

      // 元/块 只有在紧跟金额时才算货币单位，避免「李元」这类名字被切开
      if ((ch === '元' || ch === '块') && prev && (prev.type === 'num' || prev.type === 'cnnum')) {
        tokens.push({ type: 'cur', start: i, end: i + 1, text: ch });
        i++;
        continue;
      }

      if (ch === '\u00A5' || ch === '\uFFE5') {
        tokens.push({ type: 'cur', start: i, end: i + 1, text: ch });
        i++;
        continue;
      }

      if (RE_CJK.test(ch)) {
        const start = i;
        while (i < s.length && RE_CJK.test(s[i])) i++;
        const text = s.slice(start, i);
        let pureNum = text.length >= 2;
        for (let k = 0; pureNum && k < text.length; k++) {
          if (CN_CHARS.indexOf(text[k]) < 0) pureNum = false;
        }
        if (pureNum) {
          tokens.push({ type: 'cnnum', start: start, end: i, text: text, value: round2(cnToNumber(text)) });
        } else if (text.length >= 2 && (text[text.length - 1] === '元' || text[text.length - 1] === '块')) {
          // 「八百块」是一个连续汉字串，末字的货币单位要单独切出来才认得出金额
          const core = text.slice(0, -1);
          let coreNum = true;
          for (let k = 0; coreNum && k < core.length; k++) {
            if (CN_CHARS.indexOf(core[k]) < 0) coreNum = false;
          }
          if (coreNum) {
            tokens.push({ type: 'cnnum', start: start, end: i - 1, text: core, value: round2(cnToNumber(core)) });
            tokens.push({ type: 'cur', start: i - 1, end: i, text: text[text.length - 1] });
          } else {
            tokens.push({ type: 'word', start: start, end: i, text: text });
          }
        } else {
          tokens.push({ type: 'word', start: start, end: i, text: text });
        }
        continue;
      }

      tokens.push({ type: 'punct', start: i, end: i + 1, text: ch });
      i++;
    }
    return tokens;
  }

  // 「张三」里带数字汉字也合法，所以只拒绝整串都是数字汉字的词
  // 这些词夹在人名和金额之间是正常的（「张三 送礼 800」），跳过它们继续找人名
  function isMetaWord(text) {
    if (text === '收' || text === '送') return true;
    return OCCASIONS.indexOf(text) >= 0 || RELATIONS.indexOf(text) >= 0 || DIRECTIONS.indexOf(text) >= 0;
  }

  // 契约明确「不许把微信红包当人名」；这几个付款方式在礼簿里只会是备注
  const NOT_NAME = ['微信红包', '支付宝', '银行卡', '转账', '红包', '现金', '微信', '银行'];

  function isValidName(text) {
    if (!text || text.length > 4) return false;
    if (NOT_NAME.indexOf(text) >= 0) return false;
    if (OCCASIONS.indexOf(text) >= 0) return false;
    if (RELATIONS.indexOf(text) >= 0) return false;
    if (DIRECTIONS.indexOf(text) >= 0) return false;
    let pureNum = true;
    for (let i = 0; i < text.length; i++) {
      if (CN_CHARS.indexOf(text[i]) < 0) { pureNum = false; break; }
    }
    return !pureNum;
  }

  function removeAll(text, word) { return text.split(word).join(' '); }

  function cutOut(text, spans) {
    if (!spans.length) return text;
    const sorted = spans.slice().sort(function (a, b) { return a[0] - b[0]; });
    let out = '';
    let cur = 0;
    for (let i = 0; i < sorted.length; i++) {
      const lo = Math.max(0, sorted[i][0]);
      const hi = Math.min(text.length, sorted[i][1]);
      if (lo > cur) out += text.slice(cur, lo);
      if (hi > cur) cur = hi;
    }
    if (cur < text.length) out += text.slice(cur);
    return out;
  }

  function extractMeta(text, base) {
    let work = text;
    let direction = base.direction;
    let occasion = base.occasion;
    let relation = base.relation;

    // 方向必须先于场合/关系剔除：先拆单字「收」会把「收礼」拆成「礼」
    let hit = '';
    for (let i = 0; i < DIRECTIONS.length; i++) {
      if (work.indexOf(DIRECTIONS[i]) >= 0) { hit = DIRECTIONS[i]; break; }
    }
    if (hit) {
      direction = hit;
      work = removeAll(work, hit);
    } else if (work.indexOf('收') >= 0) {
      direction = '收礼';
      work = removeAll(work, '收');
    } else if (work.indexOf('送') >= 0) {
      direction = '送礼';
      work = removeAll(work, '送');
    }

    hit = '';
    for (let i = 0; i < OCCASIONS.length; i++) {
      if (work.indexOf(OCCASIONS[i]) >= 0) { hit = OCCASIONS[i]; break; }
    }
    if (hit) {
      occasion = hit;
      work = removeAll(work, hit);
    }

    hit = '';
    for (let i = 0; i < RELATIONS.length; i++) {
      if (work.indexOf(RELATIONS[i]) >= 0) { hit = RELATIONS[i]; break; }
    }
    if (hit) {
      relation = hit;
      work = removeAll(work, hit);
    }

    for (let i = 0; i < OCCASIONS.length; i++) work = removeAll(work, OCCASIONS[i]);
    for (let i = 0; i < RELATIONS.length; i++) work = removeAll(work, RELATIONS[i]);
    for (let i = 0; i < DIRECTIONS.length; i++) work = removeAll(work, DIRECTIONS[i]);

    const note = work
      .replace(/[\u00A5\uFFE5]/g, ' ')
      .replace(/[元块]/g, ' ')
      .replace(/[\uFF0C,。.、;；:：!！?？~～\-—_]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    return { direction: direction, occasion: occasion, relation: relation, note: note };
  }

  // 不用 toISOString：那是 UTC，东八区晚上会退回前一天
  function todayStr() {
    const d = new Date();
    const m = d.getMonth() + 1;
    const day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
  }

  function parseSegment(seg, lineNo, rawLine, base, out) {
    const tokens = tokenize(seg);
    const amtIdx = [];
    for (let t = 0; t < tokens.length; t++) {
      if (tokens[t].type === 'num' || tokens[t].type === 'cnnum') amtIdx.push(t);
    }
    if (!amtIdx.length) {
      out.errors.push({ line: lineNo, raw: rawLine, reason: '没识别出金额' });
      return;
    }

    const used = {};
    const pairs = [];
    for (let a = 0; a < amtIdx.length; a++) {
      const t = amtIdx[a];
      if (used[t]) continue;
      let nameIdx = -1;
      for (let k = t - 1; k >= 0; k--) {
        const tk = tokens[k];
        if (tk.type === 'ws' || tk.type === 'punct' || tk.type === 'cur') continue;
        if (tk.type === 'word' && !used[k] && isValidName(tk.text)) { nameIdx = k; break; }
        if (tk.type === 'word' && isMetaWord(tk.text)) continue;
        break;
      }
      if (nameIdx < 0) {
        // 金额在后面时才认「800 张三」；「3人」这种紧贴的量词不算（中间必须有分隔）
        const sep = tokens[t + 1];
        if (sep && (sep.type === 'ws' || sep.type === 'punct')) {
          for (let k = t + 2; k < tokens.length; k++) {
            const tk = tokens[k];
            if (tk.type === 'ws' || tk.type === 'punct' || tk.type === 'cur') continue;
            if (tk.type === 'word' && !used[k] && isValidName(tk.text)) { nameIdx = k; break; }
            if (tk.type === 'word' && isMetaWord(tk.text)) continue;
            break;
          }
        }
      }
      if (nameIdx < 0) continue;
      used[t] = true;
      used[nameIdx] = true;
      pairs.push({ nameIdx: nameIdx, amtIdx: t });
    }

    if (!pairs.length) {
      out.errors.push({ line: lineNo, raw: rawLine, reason: '没识别出人名' });
      return;
    }

    const spans = pairs.map(function (p) {
      const n = tokens[p.nameIdx];
      const a2 = tokens[p.amtIdx];
      return {
        ns: n.start, ne: n.end, as: a2.start, ae: a2.end,
        lo: Math.min(n.start, a2.start), hi: Math.max(n.end, a2.end)
      };
    });
    const order = spans.map(function (_, i) { return i; });
    order.sort(function (x, y) { return spans[x].lo - spans[y].lo; });

    for (let oi = 0; oi < order.length; oi++) {
      const i = order[oi];
      const sp = spans[i];
      // 间隙归左条：中文写法是「名字 金额 备注」，备注跟在自己金额后面
      const regionStart = oi === 0 ? 0 : sp.hi;
      const regionEnd = oi === order.length - 1 ? seg.length : spans[order[oi + 1]].lo;
      const sub = seg.slice(regionStart, regionEnd);
      const leftover = cutOut(sub, [[sp.ns - regionStart, sp.ne - regionStart], [sp.as - regionStart, sp.ae - regionStart]]);

      const amount = tokens[pairs[i].amtIdx].value;
      if (!(amount > 0)) {
        out.errors.push({ line: lineNo, raw: rawLine, reason: '金额必须大于 0' });
        continue;
      }

      const meta = extractMeta(leftover, base);
      out.items.push({
        person: tokens[pairs[i].nameIdx].text,
        amount: amount,
        relation: meta.relation,
        direction: meta.direction,
        occasion: meta.occasion,
        date: base.date,
        note: meta.note,
        raw: rawLine
      });
    }
  }

  function parseBatchText(text, opts) {
    const o = opts || {};
    const base = {
      direction: DIRECTIONS.indexOf(o.direction) >= 0 ? o.direction : '收礼',
      relation: RELATIONS.indexOf(o.relation) >= 0 ? o.relation : '其他',
      occasion: OCCASIONS.indexOf(o.occasion) >= 0 ? o.occasion : '其他',
      date: o.date ? String(o.date).slice(0, 10) : todayStr()
    };

    const out = { items: [], errors: [] };
    if (typeof text !== 'string' || !text) return out;

    const lines = text.split(/\r\n|\r|\n/);
    for (let li = 0; li < lines.length; li++) {
      const line = lines[li];
      if (!line.trim()) continue;
      const segs = line.split(/[、;；]/);
      for (let si = 0; si < segs.length; si++) {
        if (!segs[si].trim()) continue;
        parseSegment(segs[si], li + 1, line, base, out);
      }
    }
    return out;
  }

  return {
    parseBatchText: parseBatchText,
    OCCASIONS: OCCASIONS,
    RELATIONS: RELATIONS,
    DIRECTIONS: DIRECTIONS
  };
});

</script>
<script>
/* js/stats.js */
/**
 * 礼簿 · stats.js —— 全部统计与聚合（纯函数）
 * 契约：docs/contract.md 第 4 节。所有算术只在这里做，UI 只负责展示。
 * 纪律：不读 DOM / localStorage / window，不修改入参，不引任何依赖。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) { module.exports = factory(); }
  else { root.LB = root.LB || {}; Object.assign(root.LB, factory()); }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var OCCASIONS = ['结婚', '生小孩', '满月酒', '乔迁', '升学', '白事', '其他'];
  var RELATIONS = ['亲戚', '朋友', '同事', '邻居', '同学', '其他'];
  var DIRECTIONS = ['收礼', '送礼'];

  var OCCASION_COEF = {
    '结婚': 1.0, '生小孩': 1.0, '满月酒': 0.8, '乔迁': 0.8,
    '升学': 0.6, '白事': 0.8, '其他': 0.8
  };

  // 吉利档：金额不给随意的数字，吸附到这些常见档位
  var GIFT_STEPS = [200, 300, 400, 500, 600, 800, 1000, 1200, 1600, 1800,
    2000, 2600, 3000, 5000, 6000, 8000, 10000];

  /** 金额一律两位小数，避免 0.1+0.2 这类浮点尾巴流到 UI */
  function round2(x) {
    return Math.round(x * 100) / 100;
  }

  /** 非数字金额（手工改坏的数据）当 0 处理，不让 NaN 污染整张表 */
  function num(x) {
    var n = Number(x);
    return isFinite(n) ? n : 0;
  }

  /** 核心聚合键：人名去首尾空格 */
  function nameOf(g) {
    return String(g && g.person != null ? g.person : '').trim();
  }

  /** 原始日期字符串（截前 10 位），年份/月份过滤按契约用它的字面前缀 */
  function rawDate(g) {
    return String(g && g.date != null ? g.date : '').slice(0, 10);
  }

  /** 合法日期才参与排序与 lastDate；非法/缺失返空串，排序时沉到最后
   *  （形状对但月份 13、日 32 这类也当非法——否则它会排到所有真实日期前面） */
  function okDate(g) {
    var s = rawDate(g);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return '';
    var m = Number(s.slice(5, 7)), d = Number(s.slice(8, 10));
    return (m >= 1 && m <= 12 && d >= 1 && d <= 31) ? s : '';
  }

  /** 收礼是默认方向：只有明确写「送礼」才算支出 */
  function isSent(g) {
    return g.direction === '送礼';
  }

  /** 入参兜底：undefined / null / 非数组一律当空数组，元素里混进 null 也跳过 */
  function list(gifts) {
    var arr = gifts || [];
    var out = [];
    for (var i = 0; i < arr.length; i++) {
      if (arr[i] && typeof arr[i] === 'object') out.push(arr[i]);
    }
    return out;
  }

  /** 日期倒序；空日期排最后（比较符对 'YYYY-MM-DD' 天然成立） */
  function dateDesc(a, b) {
    var da = okDate(a), db = okDate(b);
    if (da === db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return da < db ? 1 : -1;
  }

  /** 按契约的字面口径取年份前缀（非法日期自然匹配不上任何年份，等于跳过该条） */
  function rawYear(g) {
    return String(g && g.date != null ? g.date : '').slice(0, 4);
  }

  /** 年份过滤；year 为 null/undefined 表示全部年份 */
  function pickYear(arr, year) {
    if (year === null || year === undefined || year === '') return arr.slice();
    var y = String(year), out = [];
    for (var i = 0; i < arr.length; i++) {
      if (rawYear(arr[i]) === y) out.push(arr[i]);
    }
    return out;
  }

  /** 按人聚合。net = received - sent（正数 = 他给你的多 = 你欠他） */
  function personLedger(gifts) {
    var arr = list(gifts);
    var map = Object.create(null);
    var buckets = [];

    for (var i = 0; i < arr.length; i++) {
      var g = arr[i];
      var name = nameOf(g);
      var b = map[name];
      if (!b) {
        b = map[name] = {
          person: name, relation: '', received: 0, sent: 0, count: 0, lastDate: '',
          _relDate: '', _relIdx: -1
        };
        buckets.push(b);
      }

      var amt = num(g.amount);
      if (isSent(g)) b.sent += amt; else b.received += amt;
      b.count += 1;

      var d = okDate(g);
      if (d && d > b.lastDate) b.lastDate = d;

      // 关系取该人最近一条记录：日期更大者胜；同日期或都无日期时，后录入的覆盖先录入的（后录即更新）
      if (b._relIdx < 0 || d > b._relDate || (d === b._relDate && i > b._relIdx)) {
        b.relation = String(g.relation || '其他');
        b._relDate = d;
        b._relIdx = i;
      }
    }

    var out = [];
    for (var k = 0; k < buckets.length; k++) {
      var x = buckets[k];
      var received = round2(x.received), sent = round2(x.sent);
      out.push({
        person: x.person,
        relation: x.relation || '其他',
        received: received,
        sent: sent,
        net: round2(received - sent),
        count: x.count,
        lastDate: x.lastDate
      });
    }

    // |net| 降序为主，收礼多的人排前面；同值时不让顺序随输入漂移
    out.sort(function (a, b) {
      var d = Math.abs(b.net) - Math.abs(a.net);
      if (d > 1e-9 || d < -1e-9) return d;
      return b.received - a.received;
    });
    return out;
  }

  /** 待回礼：net > threshold 的人（默认 threshold = 0），按 net 降序 */
  function owedList(gifts, threshold) {
    var t = (threshold === null || threshold === undefined) ? 0 : Number(threshold);
    if (!isFinite(t)) t = 0;

    var ledger = personLedger(gifts);
    var out = [];
    for (var i = 0; i < ledger.length; i++) {
      var p = ledger[i];
      if (p.net > t) {
        out.push({
          person: p.person, net: p.net, received: p.received,
          sent: p.sent, lastDate: p.lastDate
        });
      }
    }
    out.sort(function (a, b) {
      var d = b.net - a.net;
      if (d > 1e-9 || d < -1e-9) return d;
      return b.received - a.received;
    });
    return out;
  }

  /** 年度汇总；year 传 null 表示全部年份 */
  function yearlySummary(gifts, year) {
    var arr = pickYear(list(gifts), year);
    var received = 0, sent = 0;
    var seen = Object.create(null), people = 0;

    for (var i = 0; i < arr.length; i++) {
      var g = arr[i];
      var amt = num(g.amount);
      if (isSent(g)) sent += amt; else received += amt;
      var name = nameOf(g);
      if (!seen[name]) { seen[name] = 1; people += 1; }
    }

    received = round2(received);
    sent = round2(sent);
    return {
      received: received,
      sent: sent,
      net: round2(received - sent),
      count: arr.length,
      people: people
    };
  }

  /** 按场合聚合；顺序固定按 OCCASIONS，没有数据的场合也要占位（表格不会忽长忽短） */
  function byOccasion(gifts, year) {
    var arr = pickYear(list(gifts), year);
    var acc = Object.create(null);
    var i, j;

    for (i = 0; i < OCCASIONS.length; i++) {
      acc[OCCASIONS[i]] = { received: 0, sent: 0, count: 0 };
    }

    for (i = 0; i < arr.length; i++) {
      var g = arr[i];
      var occ = String(g.occasion || '其他');
      // 认不出的场合归到「其他」，否则这条金额会从表里凭空消失
      if (!acc[occ]) occ = '其他';
      var amt = num(g.amount);
      if (isSent(g)) acc[occ].sent += amt; else acc[occ].received += amt;
      acc[occ].count += 1;
    }

    var out = [];
    for (j = 0; j < OCCASIONS.length; j++) {
      var name = OCCASIONS[j], a = acc[name];
      var received = round2(a.received), sent = round2(a.sent);
      out.push({
        occasion: name,
        received: received,
        sent: sent,
        net: round2(received - sent),
        count: a.count
      });
    }
    return out;
  }

  /** 月度趋势，12 个月全给（没数据补 0）。year 必填 */
  function monthlyTrend(gifts, year) {
    var arr = pickYear(list(gifts), year);
    var out = [];
    var i;
    for (i = 1; i <= 12; i++) out.push({ month: i, received: 0, sent: 0 });

    for (i = 0; i < arr.length; i++) {
      var g = arr[i];
      var m = Number(rawDate(g).slice(5, 7));
      if (!(m >= 1 && m <= 12) || Math.floor(m) !== m) continue; // 非法日期跳过该条
      var amt = num(g.amount);
      if (isSent(g)) out[m - 1].sent += amt; else out[m - 1].received += amt;
    }

    for (i = 0; i < 12; i++) {
      out[i].received = round2(out[i].received);
      out[i].sent = round2(out[i].sent);
    }
    return out;
  }

  /** 往来排行：direction 限定方向、year 限定年份、limit 截断 */
  function personRanking(gifts, opts) {
    var o = opts || {};
    var direction = o.direction === undefined ? null : o.direction;
    var year = o.year === undefined ? null : o.year;
    var limit = o.limit === undefined || o.limit === null ? 10 : Number(o.limit);
    if (!isFinite(limit)) limit = 10;

    var arr = pickYear(list(gifts), year);
    var map = Object.create(null);
    var order = [];

    for (var i = 0; i < arr.length; i++) {
      var g = arr[i];
      if (direction) {
        var dir = isSent(g) ? '送礼' : '收礼';
        if (dir !== direction) continue;
      }
      var name = nameOf(g);
      var e = map[name];
      if (!e) { e = map[name] = { person: name, total: 0, count: 0 }; order.push(e); }
      e.total += num(g.amount);
      e.count += 1;
    }

    var out = [];
    for (var k = 0; k < order.length; k++) {
      out.push({ person: order[k].person, total: round2(order[k].total), count: order[k].count });
    }
    out.sort(function (a, b) {
      var d = b.total - a.total;
      if (d > 1e-9 || d < -1e-9) return d;
      return b.count - a.count;
    });
    return limit > 0 ? out.slice(0, limit) : out;
  }

  /** 某人的全部往来明细（人物页）；records 按日期降序，非法日期沉底 */
  function personDetail(gifts, person) {
    var name = String(person == null ? '' : person).trim();
    var arr = list(gifts);
    var records = [];
    var received = 0, sent = 0;

    for (var i = 0; i < arr.length; i++) {
      var g = arr[i];
      if (nameOf(g) !== name) continue;
      records.push(g);
      var amt = num(g.amount);
      if (isSent(g)) sent += amt; else received += amt;
    }

    records.sort(dateDesc); // records 是新数组，排序不会碰到入参

    received = round2(received);
    sent = round2(sent);
    return {
      person: name,
      received: received,
      sent: sent,
      net: round2(received - sent),
      records: records
    };
  }

  /** 吸附到吉利档：取 >= 目标的第一个档位；过 10000 就按 1000 向上取整 */
  function snap(v) {
    var x = num(v);
    if (x > 10000) return Math.ceil(x / 1000) * 1000;
    for (var i = 0; i < GIFT_STEPS.length; i++) {
      if (GIFT_STEPS[i] >= x) return GIFT_STEPS[i];
    }
    return Math.ceil(x / 1000) * 1000; // 现金额理论上到不了，兜底不返回 undefined
  }

  /**
   * 回礼金额建议
   * base = 他给你的每次平均金额（近 2 次权重 1.5，其余 1.0）
   * low = base*coef*0.9 / high = base*coef*1.15，两端吸附到吉利档
   */
  function suggestReturn(gifts, person, occasion) {
    var occ = (occasion === null || occasion === undefined || occasion === '')
      ? '其他' : String(occasion);
    var coef = Object.prototype.hasOwnProperty.call(OCCASION_COEF, occ)
      ? OCCASION_COEF[occ] : OCCASION_COEF['其他'];

    var name = String(person == null ? '' : person).trim();
    var arr = list(gifts);
    var mine = [];

    for (var i = 0; i < arr.length; i++) {
      var g = arr[i];
      if (nameOf(g) === name && !isSent(g)) mine.push(g); // 只算「他给你的」
    }

    var samples = mine.length;
    if (samples === 0) return { min: 0, max: 0, base: 0, coef: coef, samples: 0 };

    mine.sort(dateDesc); // mine 是新建数组，不碰入参

    var wsum = 0, asum = 0;
    for (var k = 0; k < samples; k++) {
      var w = k < 2 ? 1.5 : 1;
      wsum += w;
      asum += w * num(mine[k].amount);
    }

    var base = round2(wsum > 0 ? asum / wsum : 0);
    // 先圆到分再吸附：否则 700*0.9=630.000000000001 这类浮点尾巴会把档位顶高一档
    var min = snap(round2(base * coef * 0.9));
    var max = snap(round2(base * coef * 1.15));

    return { min: min, max: max, base: base, coef: coef, samples: samples };
  }

  return {
    personLedger: personLedger,
    owedList: owedList,
    yearlySummary: yearlySummary,
    byOccasion: byOccasion,
    monthlyTrend: monthlyTrend,
    personRanking: personRanking,
    personDetail: personDetail,
    suggestReturn: suggestReturn,
    OCCASIONS: OCCASIONS,
    RELATIONS: RELATIONS,
    DIRECTIONS: DIRECTIONS,
    OCCASION_COEF: OCCASION_COEF,
    GIFT_STEPS: GIFT_STEPS
  };
});

</script>
<script>
/* js/ui.js */
/* 礼簿 · UI 基础件：格式化、弹窗、提示、表单片段、路由注册表 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) { module.exports = factory(); }
  else { root.LB = root.LB || {}; Object.assign(root.LB, factory()); }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var ui = {};

  /* ---------- 格式化 ---------- */

  ui.esc = function (s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };

  /** 金额：整数不带小数，有零头保留两位 */
  ui.money = function (n) {
    var v = Number(n) || 0;
    var abs = Math.abs(v);
    var s = abs % 1 === 0 ? String(abs) : abs.toFixed(2);
    // 千分位：宁宁看的都是几千几万，加逗号更容易扫
    s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (v < 0 ? '-' : '') + '¥' + s;
  };

  ui.moneyPlain = function (n) { return ui.money(n).replace('¥', ''); };

  /** 'YYYY-MM-DD' -> '5月1日'；跨年补年份 */
  ui.dateShort = function (s) {
    if (!s || typeof s !== 'string' || s.length < 10) return '—';
    var y = s.slice(0, 4), m = parseInt(s.slice(5, 7), 10), d = parseInt(s.slice(8, 10), 10);
    if (!m || !d) return '—';
    var nowY = new Date().getFullYear();
    return (String(nowY) === y ? '' : y + '年') + m + '月' + d + '日';
  };

  ui.avatar = function (name) {
    var ch = String(name || '?').trim().slice(0, 1) || '?';
    return '<span class="avatar">' + ui.esc(ch) + '</span>';
  };

  /** 净额文案：正数=他给你的多=你欠他 */
  ui.netText = function (net) {
    var v = Math.round((Number(net) || 0) * 100) / 100;
    if (Math.abs(v) < 0.005) return { text: '两清', cls: '' };
    if (v > 0) return { text: '你欠他 ' + ui.money(v), cls: 'pos' };
    return { text: '他欠你 ' + ui.money(-v), cls: 'neg' };
  };

  /* ---------- 选择器/表单片段 ---------- */

  ui.optionsHTML = function (list, current) {
    return list.map(function (o) {
      return '<option value="' + ui.esc(o) + '"' + (o === current ? ' selected' : '') + '>' + ui.esc(o) + '</option>';
    }).join('');
  };

  ui.segHTML = function (name, values, current) {
    return '<div class="seg" data-seg="' + ui.esc(name) + '">' + values.map(function (v) {
      return '<button type="button" data-value="' + ui.esc(v) + '" aria-pressed="' + (v === current ? 'true' : 'false') + '">' + ui.esc(v) + '</button>';
    }).join('') + '</div>';
  };

  /* ---------- 提示 ---------- */

  var toastTimer = null;
  /**
   * @param {string} msg
   * @param {{action?:string, onAction?:Function, ms?:number}} [opt] 带一个可点的动作按钮（撤销用）
   */
  ui.toast = function (msg, opt) {
    var box = document.getElementById('toast');
    if (!box) return;
    opt = opt || {};
    box.textContent = '';
    var span = document.createElement('span');
    span.textContent = msg;
    box.appendChild(span);
    var btn = null;
    if (opt.action) {
      btn = document.createElement('button');
      btn.className = 'act';
      btn.type = 'button';
      btn.textContent = opt.action;
      box.appendChild(btn);
    }
    box.classList.add('show');
    clearTimeout(toastTimer);
    var ms = opt.ms || (opt.action ? 6000 : 1900); // 带动作的多留几秒，够点
    toastTimer = setTimeout(function () { box.classList.remove('show'); }, ms);
    if (btn && opt.onAction) {
      btn.addEventListener('click', function () {
        box.classList.remove('show');
        clearTimeout(toastTimer);
        opt.onAction();
      }, { once: true });
    }
  };

  /* ---------- 弹窗 ---------- */

  var modalStack = [];

  /**
   * @param {{title:string, body:string, foot?:string, wide?:boolean, onMount?:Function, onClose?:Function}} opt
   */
  ui.openModal = function (opt) {
    var mask = document.getElementById('modal-mask');
    var box = document.getElementById('modal');
    if (!mask || !box) return;
    box.className = 'modal' + (opt.wide ? ' wide' : '');
    box.innerHTML =
      '<div class="modal-head"><h3>' + ui.esc(opt.title || '') + '</h3>' +
      '<button class="btn ghost sm x" data-modal-close>关闭</button></div>' +
      '<div class="modal-body">' + (opt.body || '') + '</div>' +
      (opt.foot ? '<div class="modal-foot">' + opt.foot + '</div>' : '');
    mask.classList.add('open');
    document.body.style.overflow = 'hidden';
    modalStack.push({ onClose: opt.onClose });
    if (opt.onMount) opt.onMount(box);
  };

  ui.closeModal = function () {
    var mask = document.getElementById('modal-mask');
    var box = document.getElementById('modal');
    if (!mask) return;
    mask.classList.remove('open');
    if (box) box.innerHTML = '';
    document.body.style.overflow = '';
    var top = modalStack.pop();
    if (top && top.onClose) top.onClose();
  };

  /** 二次确认，返回 Promise<boolean>；不用原生 confirm（移动端太丑且会阻塞） */
  ui.confirm = function (title, message, okText) {
    return new Promise(function (resolve) {
      var done = false;
      ui.openModal({
        title: title,
        body: '<p style="font-size:var(--fs-base);color:var(--ink-2)">' + message + '</p>',
        foot: '<button class="btn" data-modal-close>取消</button>' +
              '<button class="btn danger" data-confirm-ok>' + ui.esc(okText || '确认') + '</button>',
        onMount: function (box) {
          box.querySelector('[data-confirm-ok]').addEventListener('click', function () {
            done = true;
            ui.closeModal();
            resolve(true);
          });
        },
        onClose: function () { if (!done) resolve(false); }
      });
    });
  };

  /* ---------- 全局事件 ---------- */

  ui.bindGlobal = function () {
    var mask = document.getElementById('modal-mask');
    if (mask) {
      mask.addEventListener('click', function (e) {
        if (e.target === mask) return ui.closeModal();
        if (e.target.closest('[data-modal-close]')) ui.closeModal();
      });
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modalStack.length) ui.closeModal();
    });
    // 分段选择：点一下切换 aria-pressed
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('.seg button');
      if (!btn) return;
      var seg = btn.parentNode;
      Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      });
    });
  };

  /** 读分段选择的当前值 */
  ui.segValue = function (scope, name) {
    var seg = scope.querySelector('[data-seg="' + name + '"]');
    if (!seg) return '';
    var on = seg.querySelector('button[aria-pressed="true"]');
    return on ? on.getAttribute('data-value') : '';
  };

  /* ---------- 页面注册表 ---------- */
  ui.pages = {};

  return { ui: ui };
});

</script>
<script>
/* js/page-home.js */
/* 礼簿 · 首页：年度汇总 + 重要日期提醒 + 回礼助手 + 最近往来 */
(function () {
  'use strict';
  var LB = window.LB, ui = LB.ui, store = LB, S = LB;

  function greeting() {
    var h = new Date().getHours();
    if (h < 6) return '夜深了';
    if (h < 11) return '早上好';
    if (h < 14) return '中午好';
    if (h < 18) return '下午好';
    return '晚上好';
  }

  /** 「还有 5 天」「就是今天」这种说法，比裸露的天数好读 */
  function when(days) {
    if (days === 0) return '就是今天';
    if (days === 1) return '明天';
    if (days < 0) return Math.abs(days) + ' 天前';
    return days + ' 天后';
  }

  function kindLabel(k) {
    if (k === 'memorial') return { t: '周年', cls: 'red' };
    if (k === 'event') return { t: '事件', cls: '' };
    return { t: '回礼', cls: 'green' };
  }

  /** 最近一次他给你的那笔，用来推场合 */
  function lastReceived(gifts, person) {
    var rows = gifts.filter(function (g) {
      return g.person === person && g.direction === '收礼';
    }).sort(function (a, b) { return String(a.date) < String(b.date) ? 1 : -1; });
    return rows[0] || null;
  }


  /* ---------- 全部提醒（首页「看全部」） ---------- */
  function openRemind() {
    var st = store.load();
    var up = LB.upcoming(st.gifts, st.events, store.today(), { days: 365 });
    var body;

    if (!up.length) {
      body = '<div class="empty" style="padding:var(--sp-6) 0">' +
        '<div class="big" style="font-size:var(--fs-md)">未来一年没有要提醒的日子</div>' +
        '<p style="font-size:var(--fs-sm);max-width:340px;margin:0 auto">' +
        '提醒是从你的记录里推出来的：你欠着人情的人、白事满周年、事件满周年。' +
        '多记几笔，这里就会慢慢长出来。</p></div>';
    } else {
      // 按「这个月 / 下个月 / 更后面」分组，比一长条好扫
      var groups = {};
      up.forEach(function (u) {
        var m = String(u.date).slice(0, 7);
        (groups[m] = groups[m] || []).push(u);
      });
      body = Object.keys(groups).sort().map(function (m) {
        var label = m.slice(0, 4) + ' 年 ' + Number(m.slice(5, 7)) + ' 月';
        return '<div class="remind-group"><div class="remind-group-head">' + label + '</div>' +
          '<div class="remind-list">' + groups[m].map(function (u) {
            var lab = u.kind === 'memorial' ? { t: '周年', cls: 'red' }
              : u.kind === 'event' ? { t: '事件', cls: '' } : { t: '回礼', cls: 'green' };
            return '<div class="remind-item">' +
              '<div class="days' + (u.daysLeft <= 7 ? ' urgent' : '') + '">' + when(u.daysLeft) + '</div>' +
              '<div class="grow"><div class="t1">' + ui.esc(u.title) + '</div>' +
                '<div class="t2">' + ui.esc(u.date) + ' · ' + ui.esc(u.why || '') + '</div></div>' +
              '<span class="pill ' + lab.cls + '">' + lab.t + '</span>' +
            '</div>';
          }).join('') + '</div></div>';
      }).join('');
    }

    ui.openModal({
      title: '重要日期',
      wide: true,
      body: body,
      foot: '<button class="btn ghost" data-modal-close>关闭</button>' +
            '<button class="btn" data-ics>导进日历</button>',
      onMount: function (box) {
        box.querySelector('[data-ics]').addEventListener('click', function () {
          if (!up.length) return ui.toast('没有可导出的日子');
          var lines = [
            'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Libu//Remind//CN',
            'CALSCALE:GREGORIAN'
          ];
          up.forEach(function (u, i) {
            var d = u.date.replace(/-/g, '');
            lines.push(
              'BEGIN:VEVENT',
              'UID:libu-' + i + '-' + d + '@local',
              'DTSTAMP:' + d + 'T000000Z',
              'DTSTART;VALUE=DATE:' + d,
              'SUMMARY:' + (u.title || '人情提醒').replace(/[,;]/g, ' '),
              'DESCRIPTION:' + (u.why || '').replace(/[,;]/g, ' '),
              'END:VEVENT'
            );
          });
          lines.push('END:VCALENDAR');
          var blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = '礼簿提醒-' + store.today() + '.ics';
          document.body.appendChild(a);
          a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
          ui.toast('已导出 .ics，双击就能加进手机日历');
        });
      }
    });
  }

  var page = {
    render: function (ctx) {
      var gifts = ctx.gifts;
      var year = new Date().getFullYear();
      var sum = S.yearlySummary(gifts, year);
      var all = S.yearlySummary(gifts, null);
      var owed = S.owedList(gifts, 0);
      var owedTop = owed.slice(0, 3);

      var recent = gifts.slice().sort(function (a, b) {
        if (a.date === b.date) return 0;
        return a.date < b.date ? 1 : -1;
      }).slice(0, 8);

      if (!gifts.length) {
        return '' +
          '<div class="empty" style="padding-top:56px">' +
            '<div class="big">礼簿还是空的</div>' +
            '<p>记下第一笔往来，之后就能按人查、按年算。</p>' +
            '<div class="inline" style="justify-content:center;margin-top:var(--sp-5)">' +
              '<button class="btn primary" data-action="new-gift">记第一笔</button>' +
              '<button class="btn" data-action="voice">说一句试试</button>' +
              '<button class="btn" data-demo>载入示例数据看看</button>' +
            '</div>' +
          '</div>';
      }

      var netCls = sum.net > 0 ? 'pos' : (sum.net < 0 ? 'neg' : '');

      // 未来 60 天的人情节点
      var up = [];
      try { up = LB.upcoming(gifts, ctx.events || [], store.today(), { days: 60 }); } catch (e) { up = []; }
      var soon = up.filter(function (u) { return u.daysLeft <= 30; }).slice(0, 5);

      return '' +
        '<div class="section">' +
          '<div class="section-head">' +
            '<h2>' + year + ' 年</h2>' +
            '<span class="hint">' + sum.count + ' 笔 · ' + sum.people + ' 位往来对象</span>' +
            '<span class="spacer"></span>' +
            '<span class="hint">' + greeting() + '，宁宁</span>' +
          '</div>' +
          '<div class="summary">' +
            '<div><div class="label">总收礼</div><div class="value num pos">' + ui.money(sum.received) + '</div>' +
              '<div class="foot">共 ' + gifts.filter(function(g){return g.direction==='收礼' && String(g.date).slice(0,4)===String(year);}).length + ' 笔</div></div>' +
            '<div><div class="label">总送礼</div><div class="value num neg">' + ui.money(sum.sent) + '</div>' +
              '<div class="foot">共 ' + gifts.filter(function(g){return g.direction==='送礼' && String(g.date).slice(0,4)===String(year);}).length + ' 笔</div></div>' +
            '<div><div class="label">净差额</div><div class="value num ' + netCls + '">' + (sum.net >= 0 ? '+' : '') + ui.money(sum.net) + '</div>' +
              '<div class="foot">' + (sum.net > 0 ? '这一年收大于送' : sum.net < 0 ? '这一年送大于收' : '收送打平') + '</div></div>' +
          '</div>' +
        '</div>' +

        (soon.length
          ? '<div class="section">' +
              '<div class="section-head">' +
                '<h2>最近要记着的日子</h2>' +
                '<span class="hint">未来 30 天 · 共 ' + up.length + ' 个节点</span>' +
                '<span class="spacer"></span>' +
                '<button class="btn sm ghost" data-remind-all>看全部</button>' +
              '</div>' +
              '<div class="remind-list">' + soon.map(function (u) {
                var lab = kindLabel(u.kind);
                return '<div class="remind-item" data-remind="' + u.date + '">' +
                  '<div class="days' + (u.daysLeft <= 7 ? ' urgent' : '') + '">' + when(u.daysLeft) + '</div>' +
                  '<div class="grow"><div class="t1">' + ui.esc(u.title) + '</div>' +
                    '<div class="t2">' + ui.esc(u.date) + ' · ' + ui.esc(u.why || '') + '</div></div>' +
                  '<span class="pill ' + lab.cls + '">' + lab.t + '</span>' +
                '</div>';
              }).join('') + '</div>' +
            '</div>'
          : '') +

        '<div class="section">' +
          '<div class="section-head">' +
            '<h2>回礼助手</h2>' +
            '<span class="hint">按他的历史金额估的，仅供参考</span>' +
            '<span class="spacer"></span>' +
            (owed.length ? '<button class="btn sm ghost" data-go-people>看全部 ' + owed.length + ' 位</button>' : '') +
          '</div>' +
          (owed.length
            ? '<div class="rows">' + owedTop.map(function (o) {
                var last = lastReceived(gifts, o.person);
                var sg = null;
                try {
                  sg = S.suggestReturn(gifts, o.person, last ? last.occasion : '其他');
                } catch (e) { sg = null; }
                return '<div class="return-row click" data-person="' + ui.esc(o.person) + '">' +
                  ui.avatar(o.person) +
                  '<div class="grow">' +
                    '<div class="t1">' + ui.esc(o.person) +
                      ' <span class="pill">他给你 ' + ui.money(o.received) + '</span></div>' +
                    '<div class="t2">' + [
                      o.sent > 0 ? '<span class="nw">你回过 ' + ui.money(o.sent) + '</span>' : '',
                      '<span class="nw">还欠 ' + ui.money(o.net) + '</span>',
                      '<span class="nw">上次 ' + ui.dateShort(o.lastDate) + '</span>'
                    ].filter(Boolean).join('') + '</div>' +
                  '</div>' +
                  (sg && sg.samples
                    ? '<div class="rng">' +
                        '<div class="lab">建议回</div>' +
                        '<div class="num">' + ui.money(sg.min) + '–' + ui.money(sg.max).replace('¥', '') + '</div>' +
                      '</div>'
                    : '<div class="rng muted"><div class="lab">暂无</div><div class="num">—</div></div>') +
                '</div>';
              }).join('') + '</div>' +
              '<div class="fine-print" style="margin-top:var(--sp-2)">' +
                '算法：取他给你的加权平均（近 2 次权重更高）× 场合系数，再吸附到常用金额档（600/800/1000…）。' +
                '人情讲的是体面不是精确，落在区间里都算合适。</div>'
            : '<div class="card card-pad muted">没有欠着的人情，收送基本打平。</div>') +
        '</div>' +

        '<div class="section">' +
          '<div class="section-head">' +
            '<h2>最近往来</h2>' +
            '<span class="spacer"></span>' +
            '<span class="hint">累计 ' + gifts.length + ' 笔 · ' + ui.money(all.received + all.sent) + ' 流水</span>' +
          '</div>' +
          '<div class="rows">' + recent.map(function (g) {
            var cls = g.direction === '收礼' ? 'in' : 'out';
            var sign = g.direction === '收礼' ? '+' : '-';
            return '<div class="row click" data-gift="' + ui.esc(g.id) + '">' +
              ui.avatar(g.person) +
              '<div class="grow"><div class="t1">' + ui.esc(g.person) +
                ' <span class="pill ' + (g.direction === '收礼' ? 'red' : 'green') + '">' + ui.esc(g.direction) + '</span></div>' +
                '<div class="t2">' + [
                  '<span class="nw">' + ui.dateShort(g.date) + '</span>',
                  '<span class="nw">' + ui.esc(g.occasion) + '</span>',
                  '<span class="nw">' + ui.esc(g.relation) + '</span>'
                ].join('') + (g.note ? '<span class="nw">' + ui.esc(g.note) + '</span>' : '') + '</div></div>' +
              '<span class="amt ' + cls + '">' + sign + ui.money(g.amount).replace('¥', '') + '</span>' +
            '</div>';
          }).join('') + '</div>' +
        '</div>';
    },

    mount: function (host, ctx) {
      host.addEventListener('click', function (e) {
        var p = e.target.closest('[data-person]');
        if (p) return APP.go('people', p.getAttribute('data-person'));
        var g = e.target.closest('[data-gift]');
        if (g) {
          var rec = ctx.gifts.filter(function (x) { return x.id === g.getAttribute('data-gift'); })[0];
          if (rec) APP.openGiftEditor({ gift: rec });
          return;
        }
        if (e.target.closest('[data-go-people]')) return APP.go('people');
        if (e.target.closest('[data-remind-all]')) {
          return LB.openRemind ? LB.openRemind() : ui.toast('提醒模块没加载');
        }
        if (e.target.closest('[data-demo]')) {
          store.demoData();
          ui.toast('已载入示例数据');
          return APP.afterChange(null);
        }
      });
    }
  };

  LB.ui.pages.home = page;
  LB.openRemind = openRemind;
})();

</script>
<script>
/* js/page-events.js */
/* 礼簿 · 事件页：事件列表 / 事件详情 / 批量粘贴录入 */
(function () {
  'use strict';
  var LB = window.LB, ui = LB.ui, store = LB, S = LB;

  function eventStats(gifts) {
    var received = 0, sent = 0, n = 0;
    gifts.forEach(function (g) {
      if (g.direction === '收礼') received += g.amount; else sent += g.amount;
      n++;
    });
    return { received: Math.round(received * 100) / 100, sent: Math.round(sent * 100) / 100, net: Math.round((received - sent) * 100) / 100, count: n };
  }

  function renderList(ctx) {
    var events = ctx.events.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    if (!events.length) {
      return '<div class="empty"><div class="big">还没有事件</div>' +
        '<p>婚礼、满月、乔迁各建一个，礼金就能归到具体场合里。</p>' +
        '<div class="inline" style="justify-content:center;margin-top:var(--sp-5)">' +
        '<button class="btn primary" data-action="new-event">新建事件</button></div></div>';
    }
    var byType = {};
    events.forEach(function (e) { byType[e.type] = (byType[e.type] || 0) + 1; });
    var typeLine = Object.keys(byType).map(function (k) { return k + ' ' + byType[k]; }).join(' · ');

    return '' +
      '<div class="section">' +
        '<div class="section-head"><h2>全部事件</h2><span class="hint">' + events.length + ' 个 · ' + typeLine + '</span>' +
          '<span class="spacer"></span><button class="btn sm" data-action="new-event">＋ 新建</button></div>' +
        '<div class="rows">' + events.map(function (e) {
          var st = eventStats(store.giftsOfEvent(e.id));
          return '<div class="row click" data-event="' + ui.esc(e.id) + '">' +
            '<div class="grow"><div class="t1">' + ui.esc(e.title) +
              ' <span class="pill">' + ui.esc(e.type) + '</span></div>' +
              '<div class="t2">' + ui.dateShort(e.date) + ' · ' + st.count + ' 笔' +
              (st.count ? ' · 收 ' + ui.money(st.received) : '') +
              (e.note ? ' · ' + ui.esc(e.note) : '') + '</div></div>' +
            (st.count ? '<span class="amt ' + (st.net >= 0 ? 'in' : 'out') + '">' + (st.net >= 0 ? '+' : '') + ui.money(Math.abs(st.net)).replace('¥', '') + '</span>' : '<span class="pill">未记账</span>') +
          '</div>';
        }).join('') + '</div>' +
      '</div>';
  }

  function renderDetail(ctx) {
    var ev = store.getEvent(ctx.arg);
    if (!ev) return renderList(ctx);
    var gifts = store.giftsOfEvent(ev.id).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var st = eventStats(gifts);
    var persons = {};
    gifts.forEach(function (g) { persons[g.person] = 1; });

    return '' +
      '<div class="section">' +
        '<div class="section-head">' +
          '<button class="btn ghost sm" data-back>‹ 全部事件</button>' +
          '<h2>' + ui.esc(ev.title) + '</h2>' +
          '<span class="pill">' + ui.esc(ev.type) + '</span>' +
          '<span class="spacer"></span>' +
          '<button class="btn sm" data-edit-event>编辑</button>' +
        '</div>' +
        '<div class="summary" style="grid-template-columns:repeat(3,1fr)">' +
          '<div><div class="label">收礼</div><div class="value num pos">' + ui.money(st.received) + '</div><div class="foot">' + st.count + ' 笔合计</div></div>' +
          '<div><div class="label">送礼</div><div class="value num neg">' + ui.money(st.sent) + '</div><div class="foot">' + Object.keys(persons).length + ' 位来宾</div></div>' +
          '<div><div class="label">净额</div><div class="value num">' + (st.net >= 0 ? '+' : '') + ui.money(st.net) + '</div><div class="foot">' + ui.dateShort(ev.date) + '</div></div>' +
        '</div>' +
        '<div class="inline" style="margin-top:var(--sp-4)">' +
          '<button class="btn primary" data-add-gift>＋ 添加记录</button>' +
          '<button class="btn" data-batch>批量粘贴录入</button>' +
        '</div>' +
      '</div>' +

      '<div class="section">' +
        '<div class="section-head"><h2>这个事件下的记录</h2><span class="hint">' + gifts.length + ' 笔</span></div>' +
        (gifts.length ? '<div class="rows">' + gifts.map(function (g) {
          return '<div class="row click" data-gift="' + ui.esc(g.id) + '">' +
            ui.avatar(g.person) +
            '<div class="grow"><div class="t1">' + ui.esc(g.person) +
              ' <span class="pill ' + (g.direction === '收礼' ? 'red' : 'green') + '">' + ui.esc(g.direction) + '</span></div>' +
              '<div class="t2">' + ui.esc(g.relation) + ' · ' + ui.esc(g.occasion) + (g.note ? ' · ' + ui.esc(g.note) : '') + '</div></div>' +
            '<span class="amt ' + (g.direction === '收礼' ? 'in' : 'out') + '">' +
              (g.direction === '收礼' ? '+' : '-') + ui.money(g.amount).replace('¥', '') + '</span>' +
          '</div>';
        }).join('') + '</div>'
        : '<div class="card card-pad" style="color:var(--ink-4);font-size:var(--fs-sm)">还没有记录。点「批量粘贴录入」，把礼簿上的名字一次贴进来最快。</div>') +
      '</div>';
  }

  var page = {
    render: function (ctx) {
      return ctx.arg ? renderDetail(ctx) : renderList(ctx);
    },

    mount: function (host, ctx) {
      host.addEventListener('click', function (e) {
        if (e.target.closest('[data-back]')) return APP.go('events');
        var evRow = e.target.closest('[data-event]');
        if (evRow) return APP.go('events', evRow.getAttribute('data-event'));

        var evId = ctx.arg;
        var ev = evId ? store.getEvent(evId) : null;

        if (e.target.closest('[data-edit-event]') && ev) return APP.openEventEditor({ event: ev });
        if (e.target.closest('[data-add-gift]') && ev) {
          return APP.openGiftEditor({ eventId: ev.id, direction: '收礼', presetPerson: '' });
        }
        if (e.target.closest('[data-batch]') && ev) return page.openBatch(ev);

        var g = e.target.closest('[data-gift]');
        if (g) {
          var rec = ctx.gifts.filter(function (x) { return x.id === g.getAttribute('data-gift'); })[0];
          if (rec) APP.openGiftEditor({ gift: rec });
        }
      });
    },

    /* ---------- 批量粘贴 ---------- */
    openBatch: function (ev) {
      var body =
        '<p style="font-size:var(--fs-sm);color:var(--ink-3);margin-bottom:var(--sp-3)">' +
          '一行一条，直接照礼簿抄：<code>张三 800 结婚</code>、<code>李四 500 微信红包</code>。' +
          '顿号也能分隔多条。手里是纸质礼簿的话，左边拍一张照着敲。</p>' +
        (LB.photo ? LB.photo.panelHTML({ label: '纸质礼簿参照（只当参照，不存图）', textId: 'b-text' }) : '') +
        '<div class="grid-3">' +
          '<div class="field"><label>默认收 / 送</label>' + ui.segHTML('b-direction', LB.DIRECTIONS, '收礼') + '</div>' +
          '<div class="field"><label>默认关系</label><select class="select" id="b-relation">' + ui.optionsHTML(LB.RELATIONS, '其他') + '</select></div>' +
          '<div class="field"><label>日期</label><input class="input" id="b-date" type="date" value="' + ui.esc((ev && ev.date) || store.today()) + '"></div>' +
        '</div>' +
        '<div id="b-preview" class="parse-preview"></div>';

      ui.openModal({
        title: '批量录入 · ' + (ev ? ev.title : '不关联事件'),
        wide: true,
        body: body,
        foot: '<button class="btn" data-modal-close>取消</button>' +
              '<button class="btn" data-parse>解析预览</button>' +
              '<button class="btn primary" data-commit disabled>全部记下</button>',
        onMount: function (box) {
          var ta = box.querySelector('#b-text');
          var preview = box.querySelector('#b-preview');
          var commitBtn = box.querySelector('[data-commit]');
          var parsed = null;
          setTimeout(function () { ta.focus(); }, 60);

          // 拍照面板：OCR 出来的文字直接落进 #b-text，由人核对
          if (LB.photo) LB.photo.bind(box, { onText: function () { doParse(); } });

          function doParse() {
            var opts = {
              direction: ui.segValue(box, 'b-direction') || '收礼',
              relation: box.querySelector('#b-relation').value,
              date: box.querySelector('#b-date').value || store.today(),
              occasion: (ev && ev.type) || '其他',
              eventId: ev ? ev.id : null
            };
            var res = LB.parseBatchText(ta.value, opts);
            parsed = res;
            if (!res.items.length && !res.errors.length) {
              preview.innerHTML = '<div class="parse-error">没读到内容，先粘点东西进来。</div>';
              commitBtn.disabled = true;
              return;
            }
            preview.innerHTML =
              '<div style="display:flex;align-items:baseline;gap:var(--sp-3);margin-bottom:6px">' +
                '<strong style="font-size:var(--fs-sm)">识别出 ' + res.items.length + ' 条</strong>' +
                (res.errors.length ? '<span style="color:var(--red);font-size:var(--fs-xs)">' + res.errors.length + ' 行没认出来</span>' : '') +
              '</div>' +
              res.items.map(function (it) {
                return '<div class="parse-item">' +
                  '<div><strong>' + ui.esc(it.person) + '</strong> <span class="pill">' + ui.esc(it.relation) + '</span></div>' +
                  '<div class="raw">' + ui.esc(it.raw) + '</div>' +
                  '<div class="num">' + ui.money(it.amount) + '</div>' +
                  '<div><span class="pill ' + (it.direction === '收礼' ? 'red' : 'green') + '">' + ui.esc(it.direction) + '</span></div>' +
                '</div>';
              }).join('') +
              res.errors.map(function (er) {
                return '<div class="parse-error">第 ' + er.line + ' 行「' + ui.esc(er.raw) + '」：' + ui.esc(er.reason) + '</div>';
              }).join('');
            commitBtn.disabled = !res.items.length;
            commitBtn.textContent = res.items.length ? '记下这 ' + res.items.length + ' 条' : '全部记下';
          }

          box.querySelector('[data-parse]').addEventListener('click', doParse);
          ta.addEventListener('paste', function () { setTimeout(doParse, 30); });

          commitBtn.addEventListener('click', function () {
            if (!parsed || !parsed.items.length) return;
            var rows = parsed.items.map(function (it) {
              return {
                person: it.person, amount: it.amount, relation: it.relation,
                direction: it.direction, occasion: it.occasion || (ev && ev.type) || '其他',
                eventId: it.eventId || (ev ? ev.id : null), date: it.date, note: it.note
              };
            });
            store.addGiftsBulk(rows);
            ui.closeModal();
            ui.toast('已记下 ' + rows.length + ' 条', {
              action: '撤销',
              onAction: function () {
                var back = store.undoLast();
                APP.afterChange(null);
                ui.toast(back ? '已撤销' : '没东西可撤了');
              }
            });
            APP.afterChange(null);
          });
        }
      });
    }
  };

  LB.ui.pages.events = page;
})();

</script>
<script>
/* js/page-people.js */
/* 礼簿 · 人物页：按人聚合 / 单人明细 / 回礼建议 */
(function () {
  'use strict';
  var LB = window.LB, ui = LB.ui, store = LB, S = LB;

  function renderList(ctx) {
    var ledger = S.personLedger(ctx.gifts);
    if (!ledger.length) {
      return '<div class="empty"><div class="big">还没有往来对象</div>' +
        '<p>记几笔礼金，这里自动按人汇总。</p>' +
        '<div class="inline" style="justify-content:center;margin-top:var(--sp-5)">' +
        '<button class="btn primary" data-action="new-gift">记一笔</button></div></div>';
    }
    var owed = ledger.filter(function (p) { return p.net > 0; });
    var owedTotal = owed.reduce(function (s, p) { return s + p.net; }, 0);

    return '' +
      '<div class="section">' +
        '<div class="section-head"><h2>往来对象</h2>' +
          '<span class="hint">' + ledger.length + ' 位 · 待回礼 ' + owed.length + ' 位</span>' +
          '<span class="spacer"></span>' +
          '<input class="input field-inline" id="p-search" placeholder="搜人名" aria-label="搜人名">' +
        '</div>' +
        (owed.length ? '<div class="banner">' +
          '合计 <strong class="num">' + ui.money(owedTotal) + '</strong> 人情还没回，' + owed.length + ' 位在等。</div>' : '') +
        '<div class="rows" id="p-rows">' + ledger.map(function (p) {
          var net = ui.netText(p.net);
          return '<div class="row click" data-person="' + ui.esc(p.person) + '">' +
            ui.avatar(p.person) +
            '<div class="grow"><div class="t1">' + ui.esc(p.person) +
              ' <span class="pill">' + ui.esc(p.relation) + '</span></div>' +
              '<div class="t2">' + [
                '<span class="nw">收 ' + ui.money(p.received) + '</span>',
                p.sent > 0 ? '<span class="nw">送 ' + ui.money(p.sent) + '</span>' : '',
                '<span class="nw">' + p.count + ' 笔</span>',
                '<span class="nw">上次 ' + ui.dateShort(p.lastDate) + '</span>'
              ].filter(Boolean).join('') + '</div></div>' +
            '<span class="amt ' + (p.net > 0 ? 'in' : p.net < 0 ? 'out' : '') + '">' + net.text + '</span>' +
          '</div>';
        }).join('') + '</div>' +
      '</div>';
  }

  function renderDetail(ctx) {
    var name = ctx.arg;
    var d = S.personDetail(ctx.gifts, name);
    if (!d || !d.records.length) {
      return '<div class="empty"><div class="big">找不到「' + ui.esc(name) + '」的记录</div>' +
        '<div class="inline" style="justify-content:center;margin-top:var(--sp-4)">' +
        '<button class="btn" data-back>‹ 返回人物列表</button></div></div>';
    }
    var net = ui.netText(d.net);
    var sg = S.suggestReturn(ctx.gifts, name, d.records[0].occasion);
    var rel = d.records[0].relation;

    // 逐年小计，方便看"这几年跟他来回多少"
    var byYear = {};
    d.records.forEach(function (g) {
      var y = String(g.date).slice(0, 4) || '未知';
      byYear[y] = byYear[y] || { received: 0, sent: 0 };
      byYear[y][g.direction === '收礼' ? 'received' : 'sent'] += g.amount;
    });
    var years = Object.keys(byYear).sort().reverse();
    var maxYear = 1;
    years.forEach(function (y) { maxYear = Math.max(maxYear, byYear[y].received + byYear[y].sent); });

    return '' +
      '<div class="section">' +
        '<div class="section-head">' +
          '<button class="btn ghost sm" data-back>‹ 全部人物</button>' +
          '<h2>' + ui.esc(d.person) + '</h2>' +
          '<span class="pill">' + ui.esc(rel) + '</span>' +
          '<span class="spacer"></span>' +
          '<button class="btn sm" data-add-gift>＋ 记一笔</button>' +
          '<button class="btn sm" data-sheet>往来单</button>' +
        '</div>' +
        '<div class="summary">' +
          '<div><div class="label">他给你</div><div class="value num pos">' + ui.money(d.received) + '</div>' +
            '<div class="foot">' + d.records.filter(function(g){return g.direction==='收礼';}).length + ' 笔</div></div>' +
          '<div><div class="label">你给他</div><div class="value num neg">' + ui.money(d.sent) + '</div>' +
            '<div class="foot">' + d.records.filter(function(g){return g.direction==='送礼';}).length + ' 笔</div></div>' +
          '<div><div class="label">差额</div><div class="value num ' + net.cls + '">' + net.text + '</div>' +
            '<div class="foot">' + (d.net > 0 ? '下次该还的人情' : d.net < 0 ? '对方还欠着' : '往来已平') + '</div></div>' +
        '</div>' +
      '</div>' +

      '<div class="section">' +
        '<div class="section-head"><h2>回礼建议</h2>' +
          '<span class="hint">基于他的历史金额 + 场合系数</span></div>' +
        (sg.samples
          ? '<div class="card card-pad">' +
              '<div class="inline" style="align-items:baseline;gap:var(--sp-3)">' +
                '<div class="figure num">' + ui.money(sg.min) + '<span style="color:var(--ink-4);font-weight:400"> – </span>' + ui.money(sg.max) + '</div>' +
                '<span class="pill red">' + ui.esc(sg.samples + ' 次历史') + '</span>' +
              '</div>' +
              '<div class="fine-print">' +
                '他给你的平均 ' + ui.money(sg.base) + '，按「' + ui.esc(d.records[0].occasion || '其他') + '」场合系数调整成区间，再吸附到常用金额档。' +
              '</div>' +
            '</div>'
          : '<div class="card card-pad muted">他还没给过你礼金，没有历史可参考。</div>') +
      '</div>' +

      (years.length > 1 ? '<div class="section">' +
        '<div class="section-head"><h2>逐年往来</h2><span class="hint">绿=收 红=送</span></div>' +
        '<div class="card card-pad">' + years.map(function (y) {
          var r = byYear[y].received, s = byYear[y].sent;
          var rw = Math.round(r / maxYear * 100), sw = Math.round(s / maxYear * 100);
          return '<div class="ybar">' +
            '<div class="ybar-lab">' + y + '<span>' + ui.money(r + s) + '</span></div>' +
            '<div class="ybar-track">' +
              (rw ? '<i class="in" style="width:' + rw + '%"></i>' : '') +
              (sw ? '<i class="out" style="width:' + sw + '%"></i>' : '') +
            '</div></div>';
        }).join('') + '</div></div>' : '') +

      '<div class="section">' +
        '<div class="section-head"><h2>往来明细</h2><span class="hint">' + d.records.length + ' 笔</span></div>' +
        '<div class="rows">' + d.records.map(function (g) {
          var ev = g.eventId ? store.getEvent(g.eventId) : null;
          return '<div class="row click" data-gift="' + ui.esc(g.id) + '">' +
            '<div class="grow"><div class="t1">' + ui.esc(g.occasion) +
              (ev ? ' <span class="pill">' + ui.esc(ev.title) + '</span>' : '') + '</div>' +
              '<div class="t2">' + ui.dateShort(g.date) + (g.note ? ' · ' + ui.esc(g.note) : '') + '</div></div>' +
            '<span class="amt ' + (g.direction === '收礼' ? 'in' : 'out') + '">' +
              (g.direction === '收礼' ? '+' : '-') + ui.money(g.amount).replace('¥', '') + '</span>' +
          '</div>';
        }).join('') + '</div>' +
      '</div>';
  }

  var page = {
    render: function (ctx) {
      return ctx.arg ? renderDetail(ctx) : renderList(ctx);
    },

    mount: function (host, ctx) {
      var search = host.querySelector('#p-search');
      if (search) {
        search.addEventListener('input', function () {
          var q = search.value.trim();
          Array.prototype.forEach.call(host.querySelectorAll('#p-rows .row'), function (row) {
            var name = row.getAttribute('data-person') || '';
            row.style.display = (!q || name.indexOf(q) >= 0) ? '' : 'none';
          });
        });
      }

      host.addEventListener('click', function (e) {
        if (e.target.closest('[data-back]')) return APP.go('people');
        if (e.target.closest('[data-add-gift]')) {
          return APP.openGiftEditor({ presetPerson: ctx.arg || '', direction: '送礼' });
        }
        if (e.target.closest('[data-sheet]')) return openSheet(ctx.arg);
        // 行点击必须放在按钮之后：按钮自己不带 data-person，但祖先链上可能有
        var row = e.target.closest('.row[data-person]');
        if (row) return APP.go('people', row.getAttribute('data-person'));

        var g = e.target.closest('[data-gift]');
        if (g) {
          var rec = ctx.gifts.filter(function (x) { return x.id === g.getAttribute('data-gift'); })[0];
          if (rec) APP.openGiftEditor({ gift: rec });
        }
      });
    }
  };

  /* ---------- 单人往来单：打印 / 复制 ---------- */

  function sheetHTML(name) {
    var d = S.personDetail(store.load().gifts, name);
    if (!d || !d.records.length) return '';
    var net = ui.netText(d.net);
    var rows = d.records.slice().sort(function (a, b) { return String(a.date) < String(b.date) ? 1 : -1; });
    var now = new Date();

    return '<div class="sheet">' +
      '<div class="sheet-head">' +
        '<div class="t">人情往来单</div>' +
        '<div class="s">' + ui.esc(d.person) + ' · ' + ui.esc(d.records[0].relation || '') + ' · 打印于 ' +
          now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日</div>' +
      '</div>' +
      '<div class="sheet-total"><span>他给你</span><span class="num">' + ui.money(d.received) + '</span></div>' +
      '<div class="sheet-total"><span>你给他</span><span class="num">' + ui.money(d.sent) + '</span></div>' +
      '<div class="sheet-total"><span>差额</span><span class="num">' + net.text + '</span></div>' +
      '<table class="data" style="margin-top:var(--sp-4)">' +
        '<thead><tr><th>日期</th><th>方向</th><th>场合</th><th>金额</th><th>备注</th></tr></thead>' +
        '<tbody>' + rows.map(function (g) {
          return '<tr>' +
            '<td>' + ui.esc(g.date) + '</td>' +
            '<td>' + ui.esc(g.direction) + '</td>' +
            '<td>' + ui.esc(g.occasion || '') + '</td>' +
            '<td class="' + (g.direction === '收礼' ? 'pos' : 'neg') + '">' +
              (g.direction === '收礼' ? '+' : '-') + ui.money(g.amount).replace('¥', '') + '</td>' +
            '<td>' + ui.esc(g.note || '') + '</td>' +
          '</tr>';
        }).join('') + '</tbody>' +
      '</table>' +
      '<div class="sheet-sign"><span>礼簿 · 本地记账，数据不外传</span><span>共 ' + rows.length + ' 笔</span></div>' +
    '</div>';
  }

  function plainText(name) {
    var d = S.personDetail(store.load().gifts, name);
    if (!d || !d.records.length) return '';
    var lines = ['人情往来 · ' + d.person, ''];
    d.records.slice().sort(function (a, b) { return String(a.date) < String(b.date) ? 1 : -1; }).forEach(function (g) {
      lines.push(g.date + ' ' + (g.direction === '收礼' ? '收' : '送') + ' ' + ui.money(g.amount).replace('¥', '') +
        ' ' + (g.occasion || '') + (g.note ? '（' + g.note + '）' : ''));
    });
    lines.push('');
    lines.push('他给你 ' + ui.money(d.received) + ' / 你给他 ' + ui.money(d.sent));
    lines.push(ui.netText(d.net).text);
    return lines.join('\n');
  }

  function openSheet(name) {
    var html = sheetHTML(name);
    if (!html) return ui.toast('这个人没有记录');
    ui.openModal({
      title: '往来单 · ' + name,
      wide: true,
      body: html,
      foot: '<button class="btn ghost" data-modal-close>关闭</button>' +
            '<button class="btn" data-copy>复制文字</button>' +
            '<button class="btn primary" data-print>打印 / 存 PDF</button>',
      onMount: function (box) {
        box.querySelector('[data-print]').addEventListener('click', function () {
          var area = document.getElementById('print-area');
          var back = document.body.style.overflow;
          if (!area) return ui.toast('打印区域没找到');
          area.innerHTML = html;
          // 打印时弹窗必须让开，否则纸上只有遮罩
          document.getElementById('modal-mask').classList.remove('open');
          document.body.style.overflow = '';
          var done = function () {
            area.innerHTML = '';
            document.body.style.overflow = back;
            window.removeEventListener('afterprint', done);
          };
          window.addEventListener('afterprint', done);
          setTimeout(function () {
            window.print();
            setTimeout(done, 800); // Safari 不一定发 afterprint
          }, 60);
        });

        box.querySelector('[data-copy]').addEventListener('click', function () {
          var text = plainText(name);
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { ui.toast('已复制，去微信里粘贴'); },
              function () { ui.toast('浏览器不让复制，长按选中吧'); });
          } else {
            // 老浏览器/非安全上下文兜底
            var ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); ui.toast('已复制'); } catch (e) { ui.toast('复制不了，长按选中吧'); }
            document.body.removeChild(ta);
          }
        });
      }
    });
  }

  LB.ui.pages.people = page;
})();

</script>
<script>
/* js/page-stats.js */
/* 礼簿 · 统计页：年度/场合/月度/排行 */
(function () {
  'use strict';
  var LB = window.LB, ui = LB.ui, store = LB, S = LB;

  /** 纯 CSS 柱状图：比 SVG 好控、能 hover 出数值 */
  function trendHTML(data) {
    var max = 0;
    data.forEach(function (d) { max = Math.max(max, d.received || 0, d.sent || 0); });
    if (max <= 0) return '<div class="empty" style="padding:32px 0">这一年还没有数据</div>';

    return '<div class="trend">' + data.map(function (d) {
      var hr = d.received > 0 ? Math.max(2, Math.round(d.received / max * 100)) : 0;
      var hs = d.sent > 0 ? Math.max(2, Math.round(d.sent / max * 100)) : 0;
      var has = d.received > 0 || d.sent > 0;
      return '<div class="col' + (has ? ' has' : '') + '">' +
        '<div class="bars">' +
          (has
            ? '<div class="trend-tip">收 ' + ui.money(d.received) + '<br>送 ' + ui.money(d.sent) + '</div>'
            : '') +
          (hr ? '<div class="bar in" style="height:' + hr + '%"></div>' : '') +
          (hs ? '<div class="bar out" style="height:' + hs + '%"></div>' : '') +
        '</div>' +
        '<div class="lab">' + ui.esc(d.label) + '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  var page = {
    render: function (ctx) {
      var gifts = ctx.gifts;
      if (!gifts.length) {
        return '<div class="empty"><div class="big">还没有数据可统计</div>' +
          '<p>记几笔之后，这里会按场合、按月、按人给你算清楚。</p>' +
          '<div class="inline" style="justify-content:center;margin-top:var(--sp-5)">' +
            '<button class="btn primary" data-action="new-gift">记第一笔</button>' +
          '</div></div>';
      }
      var nowY = new Date().getFullYear();
      var years = {};
      gifts.forEach(function (g) { years[String(g.date).slice(0, 4)] = 1; });
      var yearList = Object.keys(years).filter(function (y) { return /^\d{4}$/.test(y); }).sort().reverse();
      var year = ctx.arg || String(nowY);
      if (yearList.indexOf(year) < 0 && yearList.length) year = yearList[0];

      var sum = S.yearlySummary(gifts, year);
      var all = S.yearlySummary(gifts, null);
      var occ = S.byOccasion(gifts, year);
      var months = S.monthlyTrend(gifts, year);
      var rankTop = S.personRanking(gifts, { direction: '收礼', year: year, limit: 8 });
      var rankOut = S.personRanking(gifts, { direction: '送礼', year: year, limit: 8 });

      var inCount = 0, outCount = 0;
      gifts.forEach(function (g) {
        if (String(g.date).slice(0, 4) !== String(year)) return;
        if (g.direction === '送礼') outCount += 1; else inCount += 1;
      });

      var occMax = 0;
      occ.forEach(function (o) { occMax = Math.max(occMax, o.received + o.sent); });

      var monthData = months.map(function (m) {
        return { label: m.month + '月', received: m.received, sent: m.sent };
      });

      return '' +
        '<div class="section">' +
          '<div class="section-head"><h2>统计</h2>' +
            '<span class="hint">累计 ' + all.count + ' 笔 · ' + ui.money(all.received + all.sent) + ' 流水</span>' +
            '<span class="spacer"></span>' +
            '<select class="select field-inline" id="s-year" aria-label="选年份">' +
              yearList.map(function (y) {
                return '<option value="' + y + '"' + (y === year ? ' selected' : '') + '>' + y + ' 年</option>';
              }).join('') +
            '</select>' +
          '</div>' +
          '<div class="summary">' +
            '<div><div class="label">收礼</div><div class="value num pos">' + ui.money(sum.received) + '</div><div class="foot">' + sum.people + ' 位 · ' + inCount + ' 笔</div></div>' +
            '<div><div class="label">送礼</div><div class="value num neg">' + ui.money(sum.sent) + '</div><div class="foot">' + outCount + ' 笔</div></div>' +
            '<div><div class="label">净差额</div><div class="value num">' + (sum.net >= 0 ? '+' : '') + ui.money(sum.net) + '</div><div class="foot">' + (sum.net >= 0 ? '收大于送' : '送大于收') + '</div></div>' +
          '</div>' +
        '</div>' +

        '<div class="section">' +
          '<div class="section-head"><h2>按月趋势</h2><span class="hint">' + year + ' 年 · 鼠标停在柱上能看数</span></div>' +
          '<div class="card"><div class="chart-wrap">' + trendHTML(monthData) + '</div>' +
            '<div class="chart-legend">' +
              '<span><i class="legend-dot in"></i>收礼</span>' +
              '<span><i class="legend-dot out"></i>送礼</span>' +
            '</div></div>' +
        '</div>' +

        '<div class="section">' +
          '<div class="section-head"><h2>按场合</h2><span class="hint">' + year + ' 年各类事项的收支</span></div>' +
          '<div class="card"><div class="table-wrap"><table class="data"><thead><tr>' +
            '<th>场合</th><th>收礼</th><th>送礼</th><th>净额</th><th class="w-bar">占比</th>' +
          '</tr></thead><tbody>' + occ.map(function (o) {
            var w = occMax ? Math.round((o.received + o.sent) / occMax * 100) : 0;
            return '<tr><td>' + ui.esc(o.occasion) + '</td>' +
              '<td class="pos num">' + (o.received ? ui.money(o.received) : '—') + '</td>' +
              '<td class="neg num">' + (o.sent ? ui.money(o.sent) : '—') + '</td>' +
              '<td class="num">' + (o.count ? (o.net >= 0 ? '+' : '') + ui.money(o.net) : '—') + '</td>' +
              '<td class="w-bar"><div class="minibar"><i style="width:' + w + '%"></i></div></td></tr>';
          }).join('') + '</tbody></table></div></div>' +
        '</div>' +

        '<div class="section">' +
          '<div class="section-head"><h2>往来排行</h2><span class="hint">' + year + ' 年 · 点名字看他的往来</span></div>' +
          '<div class="grid-2">' +
            '<div><div class="rank-head">收礼最多</div>' +
              '<div class="card"><table class="data"><tbody>' +
              (rankTop.length ? rankTop.map(function (r, i) {
                return '<tr class="click" data-person="' + ui.esc(r.person) + '">' +
                  '<td class="rank-no">' + (i + 1) + '</td><td>' + ui.esc(r.person) + '</td>' +
                  '<td class="pos num">' + ui.money(r.total) + '</td>' +
                  '<td class="rank-n">' + r.count + ' 笔</td></tr>';
              }).join('') : '<tr><td class="muted">暂无</td></tr>') +
              '</tbody></table></div></div>' +
            '<div><div class="rank-head">送礼最多</div>' +
              '<div class="card"><table class="data"><tbody>' +

<script>
/* js/page-settings.js */
/* 礼簿 · 设置页：导出 / 导入 / 回收站 / 示例 / 清空 / 隐私说明 */
(function () {
  'use strict';
  var LB = window.LB, ui = LB.ui, store = LB;

  function download(filename, text, mime) {
    var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    // 立刻 revoke 在 Safari 上会截断文件，等一拍
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  function stamp() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }

  function trashRows() {
    var list = store.trashList();
    if (!list.length) {
      return '<div class="card card-pad muted">回收站是空的。删掉的记录会在这里待 ' + store.TRASH_DAYS + ' 天。</div>';
    }
    return '<div class="rows">' + list.slice(0, 8).map(function (t) {
      var r = t.row || {};
      var title = t.kind === 'event'
        ? ('事件 · ' + (r.title || r.type || '未命名'))
        : ((r.person || '') + ' · ' + ui.money(r.amount || 0));
      var sub = t.kind === 'event'
        ? (r.type || '') + ' · ' + ui.dateShort(r.date)
        : ui.dateShort(r.date) + ' · ' + (r.occasion || '') + (r.direction ? ' · ' + r.direction : '');
      return '<div class="trash-item" data-trash="' + ui.esc(t.at) + '">' +
        '<div class="grow"><div class="t1">' + ui.esc(title) + '</div>' +
          '<div class="t2">' + ui.esc(sub) + '</div></div>' +
        '<button class="btn sm" data-restore="' + ui.esc(t.at) + '">恢复</button>' +
      '</div>';
    }).join('') + '</div>' +
    (list.length > 8 ? '<div class="fine-print" style="margin-top:var(--sp-2)">还有 ' + (list.length - 8) + ' 条更早的，点「清空回收站」前能恢复的都在这里。</div>' : '');
  }

  var page = {
    render: function (ctx) {
      var db = store.load();
      var size = 0;
      try { size = (store.exportJSON().length / 1024).toFixed(1); } catch (e) { size = '?'; }
      var trashCount = store.trashList().length;

      return '' +
        '<div class="section">' +
          '<div class="section-head"><h2>设置</h2>' +
            '<span class="hint">' + db.gifts.length + ' 笔记录 · ' + db.events.length + ' 个事件 · 数据约 ' + size + ' KB</span></div>' +
          '<div class="banner">' +
            '<strong>数据只存在这台电脑的浏览器里</strong>，不上传任何服务器。' +
            '换电脑、清理浏览器缓存前，请先用下面的「导出备份」存一份文件。' +
          '</div>' +
        '</div>' +

        '<div class="section">' +
          '<div class="section-head"><h2>导出</h2><span class="hint">存到自己电脑上，当备份或给 Excel 打开</span></div>' +
          '<div class="rows">' +
            '<div class="row click" data-do="export-json">' +
              '<div class="grow"><div class="t1">导出备份（.json）</div>' +
                '<div class="t2">完整数据，能原样导回来，推荐定期存一份</div></div>' +
              '<span class="pill">推荐</span>' +
            '</div>' +
            '<div class="row click" data-do="export-csv">' +
              '<div class="grow"><div class="t1">导出表格（.csv）</div>' +
                '<div class="t2">用 Excel / WPS 直接打开看，中文不会乱码</div></div>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="section">' +
          '<div class="section-head"><h2>录入</h2><span class="hint">老礼簿一次搬进来</span></div>' +
          '<div class="rows">' +
            '<div class="row click" data-do="import-batch">' +
              '<div class="grow"><div class="t1">整段粘贴 / 拍照录入</div>' +
                '<div class="t2">把「张三 800、李四 500」一次粘进来；纸质礼簿可以拍一张照着抄</div></div>' +
            '</div>' +
            '<div class="row click" data-do="voice">' +
              '<div class="grow"><div class="t1">语音记一笔</div>' +
                '<div class="t2">说「张三结婚八百」自动拆成人名、场合、金额</div></div>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="section">' +
          '<div class="section-head"><h2>导入备份</h2><span class="hint">换电脑 / 恢复备份</span></div>' +
          '<div class="rows">' +
            '<div class="row click" data-do="import">' +
              '<div class="grow"><div class="t1">从 .json 文件导入</div>' +
                '<div class="t2">选「合并」会把文件里的记录加进来，选「覆盖」会先清空现有数据</div></div>' +
            '</div>' +
          '</div>' +

        '<div class="section">' +
          '<div class="section-head"><h2>回收站</h2>' +

        '<div class="section">' +
          '<div class="section-head"><h2>示例与清理</h2></div>' +

              '<div class="grow"><div class="t1 danger-text">清空所有数据</div>' +
                '<div class="t2">删掉就找不回来了，清空前请先导出备份</div></div>' +

        '<div class="section">' +
          '<div class="section-head"><h2>关于</h2></div>' +
          '<div class="card card-pad about">' +
            '<p><strong>礼簿</strong> · 把纸质礼簿电子化：记下来、查得到、算得清。</p>' +
            '<p>纯本地网页，零后端、零账号。日常记账完全不联网；只有「语音」和「识别文字」两个功能会用到浏览器自带的语音服务和模型下载，用不用都不影响记账。</p>' +
            '<p>数据存放在浏览器 localStorage 的 <code>libu.v1</code> 里——换浏览器、换电脑、清缓存都会丢，只有导出到文件才真正属于你。</p>' +

          '</div>' +

    },

    mount: function (host, ctx) {
      host.addEventListener('click', function (e) {
        // 回收站逐条恢复
        var rb = e.target.closest('[data-restore]');

          var okr = store.restoreFromTrash(rb.getAttribute('data-restore'));
          ui.toast(okr ? '已恢复' : '这条已经不在回收站了');
          return APP.refresh();
        }

        var row = e.target.closest('[data-do]');
        if (!row) return;
        var act = row.getAttribute('data-do');

        if (act === 'export-json') {
          var db = store.load();
          if (!db.gifts.length && !db.events.length) return ui.toast('还没有数据可导出');
          download('礼簿备份-' + stamp() + '.json', store.exportJSON(), 'application/json');
          return ui.toast('已导出 ' + db.gifts.length + ' 笔记录');
        }

        if (act === 'export-csv') {
          var d2 = store.load();
          if (!d2.gifts.length) return ui.toast('还没有记录可导出');
          var rows = d2.gifts.slice().sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
          download('礼簿明细-' + stamp() + '.csv', store.toCSV(rows), 'text/csv;charset=utf-8');
          return ui.toast('已导出 ' + rows.length + ' 行，可直接用 Excel 打开');

        if (act === 'import') return doImport();

        if (act === 'empty-trash') {
          return ui.confirm('清空回收站？', '里面的 ' + store.trashList().length + ' 条记录会被彻底删除，无法恢复。', '清空').then(function (ok) {
            if (!ok) return;

            APP.refresh();
            ui.toast('回收站已清空');
          });

        if (act === 'demo') {
          return ui.confirm('载入示例数据？', '会覆盖你现在所有记录。想留着就先去导出备份。', '载入示例').then(function (ok) {
            if (!ok) return;
            store.demoData();
            APP.refresh();
            ui.toast('示例数据已载入');
            APP.go('home');
          });
        }

        if (act === 'clear') {
          return ui.confirm('清空所有数据？', '记录会全部删除，回收站也会清掉，无法撤销。建议先导出一份备份。', '确认清空').then(function (ok) {
            if (!ok) return;
            store.clearAll();
            store.emptyTrash();
            APP.refresh();
            ui.toast('已清空');
            APP.go('home');
          });
        }
      });
