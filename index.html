<style>
/* 礼簿 · 设计令牌与组件（v3「朱印簿册」）
   中式册页：米黄纸 + 墨字 + 朱红印章。标题全用宋体、分隔走文武双线、小标竖排。
   不用渐变、不用玻璃拟态、不用大圆角——方角才像纸上的册页。
   改版约束：js 内联样式按 var() 引用了 --fs-* / --sp-* / --ink-* / --red，令牌名不能改。 */

:root {
  /* 纸 */
  --paper: #f4eee1;
  --paper-2: #fffdf7;
  --paper-3: #ece2ce;
  --paper-4: #ded1b7;
  /* 墨 */
  --ink: #18130f;
  --ink-2: #42362c;
  --ink-3: #746357;
  --ink-4: #a08d7a;
  --line: #e0d3bd;
  --line-strong: #c4b295;
  /* 朱（加深，印章感更足） */
  --red: #9c2a1b;
  --red-deep: #6a1710;
  --red-soft: #f6e5de;
  --red-line: #dbb2a4;
  /* 青（送）/ 赭（提醒） */
  --green: #23563c;
  --green-soft: #e1ebe2;
  --green-line: #b3c9b7;
  --amber: #7f4f0f;
  --amber-soft: #f6ead1;
  --amber-line: #dcc39a;

  /* 方角：册页不圆 */
  --r-xs: 2px;
  --r-sm: 3px;
  --r-md: 4px;
  --r-lg: 6px;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;

  --fs-xs: 12px;
  --fs-sm: 13.5px;
  --fs-base: 15px;
  --fs-md: 17.5px;
  --fs-lg: 23px;
  --fs-xl: 32px;
  --fs-2xl: 44px;
  --fs-display: 56px;

  --shadow-1: 0 1px 0 rgba(70, 48, 24, .06);
  --shadow-2: 0 12px 28px -20px rgba(58, 38, 16, .42);
  --shadow-3: 0 30px 60px -28px rgba(48, 30, 10, .5);

  --serif: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif CJK SC", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;

  --maxw: 1080px;
  --nav-h: 64px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--fs-base);
  line-height: 1.66;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

/* 纸面颗粒 + 极淡的竖格（像打了暗格的账页） */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  opacity: .42;
  background-image:
    radial-gradient(rgba(24, 19, 15, .07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(156, 42, 27, .045) 1px, transparent 1px);
  background-size: 3px 3px, 46px 100%;
}
body > * { position: relative; z-index: 1; }
body { padding-bottom: 96px; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* 标题一律宋体：这是整套「册页感」的骨架 */
h1, h2, h3, h4 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 700;
  letter-spacing: .06em;
}
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }

.num, .amt, .value, table.data .money { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 2px;
  border-radius: var(--r-xs);
}

/* ---------- 顶部（书眉） ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  height: var(--nav-h);
  display: flex; align-items: center; gap: var(--sp-4);
  padding: 0 var(--sp-5);
  background: rgba(244, 238, 225, .95);
  backdrop-filter: saturate(1.4) blur(8px);
  border-top: 3px solid var(--red);
  border-bottom: 3px double var(--line-strong);
}
.brand { display: flex; align-items: center; gap: var(--sp-3); }
/* 朱红印章：外方内白线，就是一枚盖在册页上的印 */
.brand-seal {
  width: 36px; height: 36px; flex: 0 0 36px;
  display: grid; place-items: center;
  background: var(--red);
  color: var(--paper-2);
  font-family: var(--serif); font-size: 20px; font-weight: 700;
  border-radius: 2px;
  letter-spacing: 0;
  box-shadow: inset 0 0 0 1px rgba(255, 253, 247, .62), 0 2px 0 var(--red-deep);
}
.brand-text { display: flex; align-items: baseline; gap: var(--sp-2); }
.brand-mark {
  font-family: var(--serif);
  font-size: var(--fs-md); font-weight: 700; letter-spacing: .24em;
  color: var(--ink);
}
.brand-sub {
  font-family: var(--serif);
  font-size: 10.5px; color: var(--ink-4); letter-spacing: .34em;
}

.tabs { display: flex; gap: 0; margin-left: auto; align-items: center; }
.tab {
  border: 0; background: transparent; color: var(--ink-3);
  padding: 8px 15px; border-radius: 0; font-size: var(--fs-sm);
  letter-spacing: .1em;
  transition: color .16s, background .16s;
  position: relative;
}
.tab + .tab::before {
  content: ''; position: absolute; left: 0; top: 50%; width: 1px; height: 12px;
  margin-top: -6px; background: var(--line);
}
.tab:hover { color: var(--ink); background: var(--paper-3); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 700; background: transparent; }
.tab[aria-selected="true"]::after {
  content: ''; position: absolute; left: 10px; right: 10px; bottom: 0;
  height: 2px; background: var(--red);
}
.topbar .search-trigger {
  display: inline-flex; align-items: center; gap: 6px; margin-left: var(--sp-3);
  border: 1px solid var(--line-strong); background: var(--paper-2); color: var(--ink-3);
  padding: 5px 10px 5px 11px; border-radius: var(--r-xs); font-size: var(--fs-xs);
  letter-spacing: .04em;
  transition: border-color .14s, color .14s;
}
.topbar .search-trigger:hover { border-color: var(--red); color: var(--red); }
.kbd {
  font-family: var(--sans); font-size: 10px; line-height: 1;
  padding: 3px 5px; border-radius: 2px;
  background: var(--paper-3); border: 1px solid var(--line-strong); color: var(--ink-4);
}

/* ---------- 布局 ---------- */
main { max-width: var(--maxw); margin: 0 auto; padding: var(--sp-5) var(--sp-5) var(--sp-7); position: relative; }

/* 竖排书耳：宽屏时贴在正文左侧，像册页装订边上的题字 */
@media (min-width: 1240px) {
  main::before {
    content: '礼簿 · 人情往来 · 收支有据';
    position: absolute; left: -42px; top: 6px;
    writing-mode: vertical-rl;
    font-family: var(--serif); font-size: 11px; letter-spacing: .42em;
    color: var(--ink-4); opacity: .85;
    pointer-events: none;
  }
}

.view { display: none; }
.view.active { display: block; animation: fade .24s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

.section { margin-bottom: var(--sp-6); }
.section-head {
  display: flex; align-items: baseline; gap: var(--sp-3);
  margin-bottom: var(--sp-4); padding-bottom: 7px;
  border-bottom: 3px double var(--line-strong);
}
.section-head h2 {
  font-size: var(--fs-md); letter-spacing: .12em; white-space: nowrap; flex: 0 0 auto;
  display: inline-flex; align-items: center; gap: 9px;
}
/* 书口小竖条：标题前的朱红短线 */
.section-head h2::before {
  content: ''; width: 4px; height: 1.02em; background: var(--red);
  display: block; flex: 0 0 4px;
}
.section-head .spacer { margin-left: auto; }
.section-head .hint { font-size: var(--fs-xs); color: var(--ink-4); letter-spacing: .04em; }

/* 每一页的卷首：标题更大、上下各一道线 */
.view > .section:first-child > .section-head {
  border-top: 1px solid var(--line);
  border-bottom: 3px double var(--ink);
  padding-top: var(--sp-3); padding-bottom: var(--sp-3);
  margin-bottom: var(--sp-5);
}
.view > .section:first-child > .section-head h2 {
  font-size: var(--fs-xl); letter-spacing: .16em;
}
.view > .section:first-child > .section-head h2::before { width: 6px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--paper-2);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .7), var(--shadow-1);
}
.card-pad { padding: var(--sp-4); }
.card.click { transition: transform .16s ease, box-shadow .16s ease; }
.card.click:hover { transform: translateY(-2px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), var(--shadow-2); }

/* 首页三格汇总：外双框、标签竖排 */
.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  margin: 5px;
  background: var(--line-strong);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: 0 0 0 5px var(--paper-2), 0 0 0 6px var(--line-strong), var(--shadow-1);
}
.summary > div {
  background: var(--paper-2);
  padding: var(--sp-4) var(--sp-4) var(--sp-4) var(--sp-3);
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: var(--sp-3);
  align-items: start;
}
.summary .label {
  grid-row: 1 / span 2;
  writing-mode: vertical-rl;
  white-space: nowrap;
  font-family: var(--serif);
  font-size: var(--fs-xs); color: var(--ink-3);
  letter-spacing: .22em; padding-top: 2px;
}
.summary .value {
  font-family: var(--serif);
  font-size: var(--fs-xl); font-weight: 700; line-height: 1.16;
  letter-spacing: -.01em;
}
.summary .value.pos { color: var(--red); }
.summary .value.neg { color: var(--green); }
.summary .foot { font-size: var(--fs-xs); color: var(--ink-4); margin-top: 2px; letter-spacing: .04em; }

/* 一个大数字的强调区块（回礼建议 / 往来单） */
.figure {
  font-family: var(--serif);
  font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -.005em; line-height: 1.12; color: var(--red);
}
.figure small { font-family: var(--sans); font-size: var(--fs-sm); font-weight: 400; letter-spacing: 0; color: var(--ink-4); }

/* ---------- 行列表 ---------- */
.rows {
  border: 1px solid var(--line-strong); border-radius: var(--r-md);
  background: var(--paper-2); overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .7);
}
.row {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--line);
  transition: background .14s, box-shadow .14s;
}
.row:last-child { border-bottom: 0; }
.row.click:hover { background: var(--paper-3); box-shadow: inset 3px 0 0 var(--red); cursor: pointer; }
.row .grow { flex: 1; min-width: 0; }
.row .t1 { font-size: var(--fs-base); font-weight: 600; letter-spacing: .02em; }
.row .t2 { display: flex; flex-wrap: wrap; gap: 1px var(--sp-2); font-size: var(--fs-xs); color: var(--ink-4); margin-top: 3px; letter-spacing: .02em; }
.row .t2 .nw { white-space: nowrap; }
.row .amt {
  font-family: var(--serif);
  font-size: var(--fs-base); font-weight: 700; white-space: nowrap; letter-spacing: 0;
}
.row .amt.in { color: var(--red); }
.row .amt.out { color: var(--green); }
.row .side { text-align: right; flex: 0 0 auto; }
.row .side .sub { font-size: 11px; color: var(--ink-4); }

/* 首字方块：像名刺，不像聊天头像 */
.avatar {
  width: 34px; height: 34px; flex: 0 0 34px; border-radius: var(--r-xs);
  display: grid; place-items: center;
  background: var(--paper-3); color: var(--ink-2);
  font-family: var(--serif); font-size: var(--fs-md); font-weight: 700;
  border: 1px solid var(--line-strong);
  transition: background .14s, color .14s, border-color .14s;
}
.row.click:hover .avatar { background: var(--red); color: var(--paper-2); border-color: var(--red-deep); }

/* ---------- 徽标 ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 7px; border-radius: var(--r-xs);
  font-size: 11.5px; line-height: 1.7; letter-spacing: .06em;
  border: 1px solid var(--line-strong); color: var(--ink-3); background: var(--paper-2);
}
.pill.red { background: var(--red-soft); border-color: var(--red-line); color: var(--red-deep); }
.pill.green { background: var(--green-soft); border-color: var(--green-line); color: var(--green); }
.pill.amber { background: var(--amber-soft); border-color: var(--amber-line); color: var(--amber); }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line-strong); background: var(--paper-2); color: var(--ink);
  padding: 7px 15px; border-radius: var(--r-xs);
  font-size: var(--fs-sm); font-weight: 500; letter-spacing: .06em;
  transition: background .14s, border-color .14s, transform .08s, box-shadow .14s;
}
.btn:hover { background: var(--paper-3); border-color: var(--ink-4); }
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: var(--red); border-color: var(--red-deep); color: var(--paper-2);
  box-shadow: inset 0 0 0 1px rgba(255, 253, 247, .34), 0 2px 0 var(--red-deep);
}
.btn.primary:hover { background: var(--red-deep); border-color: var(--red-deep); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-3); }
.btn.ghost:hover { background: var(--paper-3); color: var(--ink); }
.btn.danger { color: var(--red); border-color: var(--red-line); }
.btn.danger:hover { background: var(--red-soft); }
.btn.sm { padding: 4px 10px; font-size: var(--fs-xs); }
.btn.lg { padding: 10px 22px; font-size: var(--fs-base); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn-dock { position: fixed; right: 28px; bottom: 28px; z-index: 45; display: flex; flex-direction: column; gap: var(--sp-2); align-items: flex-end; }
.btn-dock .btn { box-shadow: var(--shadow-2); }
/* 桌面端不浮按钮：角上的浮层会压住列表右侧金额，记账入口改到书眉上 */
@media (min-width: 761px) { .btn-dock { display: none; } }
.topbar-new { margin-left: var(--sp-4); padding: 6px 14px; flex: 0 0 auto; }
/* 桌面缩小到 761–900 时书眉会被挤到换行：标签和大字一律不折，副标先让位 */
.tab { white-space: nowrap; flex: 0 0 auto; }
.topbar .search-trigger { flex: 0 0 auto; }
@media (min-width: 761px) and (max-width: 900px) {
  .brand-sub { display: none; }
  .topbar { gap: var(--sp-3); }
  .tab { padding: 8px 11px; letter-spacing: .06em; }
  .topbar-new { margin-left: var(--sp-3); padding: 6px 11px; }
}

/* ---------- 表单 ---------- */
.field { margin-bottom: var(--sp-4); }
.field > label {
  display: block; font-size: var(--fs-xs); color: var(--ink-3);
  margin-bottom: 6px; letter-spacing: .12em;
}
.input, .select, .textarea {
  width: 100%; padding: 9px 11px;
  border: 1px solid var(--line-strong); border-radius: var(--r-xs);
  background: var(--paper-2); color: var(--ink);
  transition: border-color .14s, box-shadow .14s;
}
.input:focus, .select:focus, .textarea:focus {
  outline: 0; border-color: var(--red);
  box-shadow: 0 0 0 3px var(--red-soft);
}
.textarea { min-height: 150px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--fs-sm); line-height: 1.8; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-4); }
.inline { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }
.range-val { font-size: var(--fs-sm); color: var(--ink-3); }

/* 分段选择（收礼 / 送礼） */
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-xs); overflow: hidden; }
.seg button {
  border: 0; background: var(--paper-2); color: var(--ink-3);
  padding: 6px 17px; font-size: var(--fs-sm); letter-spacing: .08em;
}
.seg button[aria-pressed="true"] { background: var(--red); color: var(--paper-2); font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line-strong); }

/* ---------- 弹窗 ---------- */
.modal-mask {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(24, 19, 15, .46);
  display: none; align-items: center; justify-content: center;
  padding: var(--sp-4);
}
.modal-mask.open { display: flex; }
.modal {
  width: 100%; max-width: 540px; max-height: 88vh; overflow: auto;
  background: var(--paper); border-radius: var(--r-md);
  box-shadow: 0 0 0 5px rgba(255, 253, 247, .16), var(--shadow-3);
  border: 1px solid var(--line-strong);
  animation: pop .2s ease both;
}
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: none; } }
.modal.wide { max-width: 780px; }
.modal-head {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 3px double var(--line-strong);
}
.modal-head h3 { font-size: var(--fs-md); letter-spacing: .12em; }
.modal-head .x { margin-left: auto; }
.modal-body { padding: var(--sp-5); }
.modal-foot {
  display: flex; gap: var(--sp-2); justify-content: flex-end;
  padding: var(--sp-4) var(--sp-5); border-top: 1px solid var(--line);
  background: var(--paper-3); position: sticky; bottom: 0;
}

/* ---------- 全局搜索 ---------- */
.search-modal { max-width: 620px; }
.search-modal .modal-body { padding: 0; }
.search-input-row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--line); }
.search-input-row input {
  flex: 1; border: 0; background: transparent; font-size: var(--fs-md);
  padding: 2px 0;
}
.search-input-row input:focus { outline: 0; }
/* 系统自带清除钮是蓝色小叉，和纸感体系打架 —— 收掉，交给 Esc 清空 */
.search-input-row input[type="search"]::-webkit-search-cancel-button,
.search-input-row input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
.search-input-row .ico { font-size: var(--fs-md); color: var(--ink-4); }
.search-results { max-height: 56vh; overflow: auto; }
.search-hit {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-5); border-bottom: 1px solid var(--line);
  transition: background .12s, box-shadow .12s;
}
.search-hit:last-child { border-bottom: 0; }
.search-hit:hover, .search-hit[aria-selected="true"] { background: var(--paper-3); box-shadow: inset 3px 0 0 var(--red); cursor: pointer; }
.search-hit .hit-main { flex: 1; min-width: 0; }
.search-hit .hit-t { font-size: var(--fs-base); font-weight: 600; }
.search-hit .hit-s { font-size: var(--fs-xs); color: var(--ink-4); margin-top: 2px; }
.search-hit .hit-tag { font-size: 11px; color: var(--ink-4); letter-spacing: .14em; flex: 0 0 auto; }
.search-empty { padding: var(--sp-6) var(--sp-5); text-align: center; color: var(--ink-4); font-size: var(--fs-sm); }
.search-tips { padding: var(--sp-3) var(--sp-5); border-top: 1px solid var(--line); font-size: 11px; color: var(--ink-4); display: flex; gap: var(--sp-4); flex-wrap: wrap; }
.search-hit mark { background: var(--red-soft); color: var(--red-deep); padding: 0 2px; border-radius: 2px; }

/* ---------- 批量解析预览 ---------- */
.parse-preview { margin-top: var(--sp-4); }
.parse-item {
  display: grid; grid-template-columns: 1fr auto auto auto; gap: var(--sp-3);
  align-items: center; padding: var(--sp-2) var(--sp-3);
  border-bottom: 1px solid var(--line); font-size: var(--fs-sm);
}
.parse-item:first-child { border-top: 1px solid var(--line); }
.parse-item .raw { color: var(--ink-4); font-size: var(--fs-xs); }
.parse-error { color: var(--red-deep); background: var(--red-soft); border: 1px solid var(--red-line); padding: var(--sp-2) var(--sp-3); border-radius: var(--r-xs); font-size: var(--fs-sm); margin-top: var(--sp-2); }

/* ---------- 拍照参照 + OCR ---------- */
.photo-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); align-items: start; }
.photo-drop {
  border: 1px dashed var(--line-strong); border-radius: var(--r-sm);
  background: var(--paper-2); padding: var(--sp-4);
  text-align: center; color: var(--ink-3); font-size: var(--fs-sm);
  transition: border-color .14s, background .14s;
  min-height: 96px; display: grid; place-items: center; gap: var(--sp-2);
}
.photo-drop:hover, .photo-drop.over { border-color: var(--red); background: var(--red-soft); }
.photo-drop .big { font-family: var(--serif); font-size: var(--fs-lg); color: var(--ink-4); }
.photo-shot {
  position: relative; border-radius: var(--r-sm); overflow: hidden;
  border: 1px solid var(--line-strong); background: var(--paper-3);
}
.photo-shot img { display: block; width: 100%; height: auto; max-height: 320px; object-fit: contain; }
.photo-shot .zoom {
  position: absolute; right: 8px; bottom: 8px;
  background: rgba(24,19,15,.78); color: var(--paper-2); border: 0;
  padding: 4px 10px; border-radius: var(--r-xs); font-size: 11px; letter-spacing: .06em;
}
.ocr-bar { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-2); font-size: var(--fs-xs); color: var(--ink-3); }
.ocr-bar .dot { width: 7px; height: 7px; border-radius: 1px; background: var(--amber); }
.ocr-bar.done .dot { background: var(--green); }
.ocr-bar.fail .dot { background: var(--red); }

/* 全屏看图（照着实物录入时用） */
.viewer { position: fixed; inset: 0; z-index: 150; background: rgba(14,11,8,.95); display: none; }
.viewer.open { display: block; }
.viewer img { position: absolute; inset: 0; margin: auto; max-width: 96vw; max-height: 94vh; object-fit: contain; }
.viewer .close {
  position: absolute; right: 18px; top: 18px;
  background: rgba(255,253,247,.16); color: var(--paper-2); border: 0;
  padding: 7px 15px; border-radius: var(--r-xs); font-size: var(--fs-sm); letter-spacing: .08em;
}

/* ---------- 回礼助手 ---------- */
.return-card { display: grid; gap: var(--sp-3); }
.return-row {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) 0; border-bottom: 1px solid var(--line);
}
.return-row:last-child { border-bottom: 0; padding-bottom: 0; }
.return-row .grow { flex: 1 1 auto; min-width: 0; }
.return-row .t1 { font-size: var(--fs-base); font-weight: 600; letter-spacing: .02em; }
.return-row .t2 {
  font-size: var(--fs-xs); color: var(--ink-4); margin-top: 4px;
  display: flex; flex-wrap: wrap; gap: 1px var(--sp-3);
}
.return-row .t1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.return-row .t2 .nw { white-space: nowrap; }
.return-row .rng { text-align: right; white-space: nowrap; flex: 0 0 auto; }
.return-row .rng .lab { font-family: var(--serif); font-size: 10.5px; color: var(--ink-4); letter-spacing: .16em; margin-bottom: 2px; }
.return-row .rng .num { font-family: var(--serif); font-size: var(--fs-md); font-weight: 700; color: var(--red); letter-spacing: 0; }
.return-row .rng.muted .num { color: var(--ink-4); }
.fine-print { font-size: var(--fs-xs); color: var(--ink-4); line-height: 1.7; }

/* ---------- 提醒（重要日期） ---------- */
.remind-group { margin-bottom: var(--sp-5); }
.remind-group:last-child { margin-bottom: 0; }
.remind-group-head {
  font-family: var(--serif); font-size: var(--fs-xs); letter-spacing: .18em; color: var(--ink-3);
  margin-bottom: var(--sp-2); padding-bottom: 4px; border-bottom: 3px double var(--line-strong);
}
.remind-list { display: grid; gap: var(--sp-2); }
.remind-item {
  display: flex; align-items: flex-start; gap: var(--sp-3);
  padding: var(--sp-3); border-radius: var(--r-xs);
  background: var(--paper-2); border: 1px solid var(--line-strong);
  border-left: 3px solid var(--line-strong);
}
.remind-item .days {
  flex: 0 0 auto; text-align: center; min-width: 54px;
  font-family: var(--serif); font-size: var(--fs-sm); font-weight: 700; line-height: 1.4;
  color: var(--ink-2); letter-spacing: .02em;
}
.remind-item .days.urgent { color: var(--red); }
.remind-item .grow { min-width: 0; }
.remind-item .t1 { font-size: var(--fs-sm); font-weight: 600; }
.remind-item .t2 { font-size: 11px; color: var(--ink-4); margin-top: 2px; }

/* ---------- 回收站 / 设置页 ---------- */
.trash-item {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line);
  font-size: var(--fs-sm);
}
.trash-item:first-child { border-top: 1px solid var(--line); }
.trash-item:last-child { border-bottom: 0; }
.trash-item .grow { min-width: 0; }
.trash-item .meta { flex: 1; min-width: 0; }
.trash-item .meta .t { font-weight: 600; }
.trash-item .meta .s { font-size: 11px; color: var(--ink-4); margin-top: 2px; }
.trash-item .t1 { font-size: var(--fs-sm); font-weight: 600; }
.trash-item .t2 { font-size: 11px; color: var(--ink-4); margin-top: 2px; }
.trash-item .left { flex: 0 0 auto; font-size: 11px; color: var(--ink-4); }
.danger-text { color: var(--red); }
.about { font-size: var(--fs-sm); color: var(--ink-3); line-height: 1.85; }
.about p + p { margin-top: var(--sp-3); }
.about code { background: var(--paper-3); padding: 1px 5px; border-radius: 2px; font-size: .92em; }

/* ---------- 统计页小件 ---------- */
.legend-dot.in { background: var(--red); }
.legend-dot.out { background: var(--green); }
table.data .w-bar { width: 120px; }
table.data .rank-no { color: var(--ink-4); width: 24px; font-family: var(--serif); }
table.data .rank-n { color: var(--ink-4); width: 52px; white-space: nowrap; text-align: right; }
.rank-head {
  font-family: var(--serif); font-size: var(--fs-xs); color: var(--ink-3);
  margin-bottom: var(--sp-2); letter-spacing: .18em;
}
.minibar { background: var(--paper-3); height: 7px; border-radius: 1px; overflow: hidden; }
.minibar i { display: block; height: 100%; background: var(--red); opacity: .55; }

/* ---------- 逐年往来条 ---------- */
.ybar { margin-bottom: var(--sp-3); }
.ybar:last-child { margin-bottom: 0; }
.ybar-lab {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: var(--fs-xs); color: var(--ink-3); margin-bottom: 4px;
}
.ybar-lab span { color: var(--ink-4); font-variant-numeric: tabular-nums; }
.ybar-track { display: flex; gap: 3px; height: 9px; }
.ybar-track i { display: block; border-radius: 1px; min-width: 2px; }
.ybar-track i.in { background: var(--red); opacity: .62; }
.ybar-track i.out { background: var(--green); opacity: .62; }

/* ---------- 通用小件 ---------- */
.muted { color: var(--ink-4); font-size: var(--fs-sm); }
.field-inline { width: 132px; padding: 4px 9px; font-size: var(--fs-sm); border-radius: var(--r-xs); }

/* ---------- 往来单（可打印） ---------- */
.sheet {
  background: var(--paper-2); border: 1px solid var(--line-strong);
  border-radius: var(--r-md); padding: var(--sp-6);
  box-shadow: inset 0 0 0 3px var(--paper-2), inset 0 0 0 4px var(--line);
}
.sheet-head { text-align: center; padding-bottom: var(--sp-4); border-bottom: 3px double var(--ink); margin-bottom: var(--sp-4); }
.sheet-head .t { font-family: var(--serif); font-size: var(--fs-lg); font-weight: 700; letter-spacing: .34em; }
.sheet-head .s { font-family: var(--serif); font-size: var(--fs-xs); color: var(--ink-4); margin-top: var(--sp-2); letter-spacing: .2em; }
.sheet-total { display: flex; justify-content: space-between; gap: var(--sp-4); padding: var(--sp-3) 0; border-bottom: 1px dashed var(--line-strong); font-size: var(--fs-sm); }
.sheet-sign { margin-top: var(--sp-5); display: flex; justify-content: space-between; font-family: var(--serif); font-size: var(--fs-xs); color: var(--ink-4); letter-spacing: .1em; }
.sheet table.data { margin-top: var(--sp-3); }
.sheet table.data th, .sheet table.data td { white-space: normal; }

/* 往来单打印：平时藏起来，只在打印时接管整张纸 */
.print-area { display: none; }

@media print {
  body::before, .topbar, .tabbar, .btn-dock, .modal-mask, .toast, .viewer, .no-print { display: none !important; }
  body { background: #fff; padding: 0; }
  main { display: none !important; }
  .view { display: none !important; }
  .print-area { display: block !important; }
  .print-area .sheet { border: 0; padding: 0; box-shadow: none; }
  .print-area table.data td, .print-area table.data th { white-space: normal; }
  @page { margin: 16mm 14mm; }
}

/* ---------- 表格 ---------- */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.data { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
table.data td { white-space: nowrap; }
table.data th {
  text-align: right; font-weight: 600; color: var(--ink-2); font-size: var(--fs-xs);
  font-family: var(--serif);
  padding: 8px var(--sp-3); border-bottom: 3px double var(--line-strong); white-space: nowrap;
  letter-spacing: .1em;
}
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data td { padding: 9px var(--sp-3); border-bottom: 1px solid var(--line); text-align: right; }
table.data tr:last-child td { border-bottom: 0; }
table.data tbody tr { transition: background .12s; }
table.data tbody tr:hover { background: var(--paper-3); }
table.data .pos { color: var(--red); }
table.data .neg { color: var(--green); }
table.data tr.click { cursor: pointer; }
table.data .share { display: inline-block; height: 6px; border-radius: 1px; background: var(--red); opacity: .55; vertical-align: middle; }

/* ---------- 图表 ---------- */
.chart-wrap { padding: var(--sp-4) var(--sp-4) var(--sp-2); overflow-x: auto; }
.chart-legend { display: flex; gap: var(--sp-4); padding: 0 var(--sp-4) var(--sp-4); font-size: var(--fs-xs); color: var(--ink-3); letter-spacing: .06em; }
.legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 1px; margin-right: 6px; vertical-align: middle; }

/* 按月趋势用纯 CSS 柱，比 SVG 更好控 */
.trend { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; align-items: end; height: 190px; padding-top: var(--sp-4); }
.trend .col { display: grid; grid-template-rows: 1fr auto; gap: 3px; height: 100%; position: relative; }
.trend .bars { display: flex; align-items: flex-end; justify-content: center; gap: 3px; min-height: 0; }
.trend .bar { width: 11px; border-radius: 1px 1px 0 0; min-height: 2px; transition: height .4s ease; }
.trend .bar.in { background: var(--red); box-shadow: inset 0 2px 0 var(--red-deep); }
.trend .bar.out { background: var(--green); box-shadow: inset 0 2px 0 #123524; }
.trend .lab { text-align: center; font-family: var(--serif); font-size: 10.5px; color: var(--ink-4); padding-top: 6px; letter-spacing: .04em; }
.trend .col.has .lab { color: var(--ink-2); }
.trend .col:hover .bar { filter: saturate(1.2) brightness(1.05); }
.trend-tip {
  position: absolute; left: 50%; transform: translate(-50%, -100%);
  background: var(--ink); color: var(--paper-2); font-size: 11px; line-height: 1.55;
  padding: 4px 9px; border-radius: var(--r-xs); white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .14s; z-index: 5;
}
.trend .col:hover .trend-tip { opacity: 1; }

/* ---------- 空态 ---------- */
.empty {
  text-align: center; padding: var(--sp-7) var(--sp-4);
  color: var(--ink-4); font-size: var(--fs-sm);
}
.empty .big {
  font-family: var(--serif); font-size: var(--fs-lg); color: var(--ink-2);
  margin-bottom: var(--sp-2); letter-spacing: .22em;
}

/* ---------- 底部标签栏（手机，默认藏） ---------- */
.tabbar { display: none; }

/* ---------- 提示条 ---------- */
.banner {
  display: block; line-height: 1.7;
  padding: var(--sp-3) var(--sp-4); border-radius: var(--r-xs);
  background: var(--amber-soft); border: 1px solid var(--amber-line);
  border-left: 3px solid var(--amber); color: #6a4712;
  font-size: var(--fs-sm); margin-bottom: var(--sp-4);
}
.banner.error { background: var(--red-soft); border-color: var(--red-line); border-left-color: var(--red); color: var(--red-deep); }
.banner .t { font-weight: 600; margin-bottom: 2px; }

.toast {
  position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%) translateY(10px);
  background: var(--ink); color: var(--paper-2); padding: 9px 18px; border-radius: var(--r-xs);
  font-size: var(--fs-sm); z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  display: flex; align-items: center; gap: var(--sp-3); max-width: 92vw;
  box-shadow: 0 0 0 1px rgba(255, 253, 247, .12);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast .act {
  border: 0; background: rgba(255,253,247,.18); color: var(--paper-2);
  padding: 3px 11px; border-radius: var(--r-xs); font-size: var(--fs-xs); font-weight: 600;
  white-space: nowrap; letter-spacing: .06em;
}
.toast .act:hover { background: rgba(255,253,247,.3); }

/* ---------- 语音记账 ---------- */
.voice-wrap { display: grid; gap: var(--sp-3); }
.voice-stage {
  display: grid; place-items: center; gap: var(--sp-3);
  padding: var(--sp-6) var(--sp-4); border-radius: var(--r-sm);
  background: var(--paper-2); border: 1px solid var(--line-strong); text-align: center;
}
/* 麦克风做成一枚印：朱红方块 + 竖排白字 */
.voice-mic {
  width: 74px; height: 74px; border-radius: 2px; border: 0;
  background: var(--red); color: var(--paper-2);
  font-family: var(--serif); font-size: 18px; font-weight: 700; letter-spacing: .12em;
  writing-mode: vertical-rl;
  display: grid; place-items: center; cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(255,253,247,.6), 0 3px 0 var(--red-deep);
  transition: transform .14s;
}
.voice-mic:hover { transform: scale(1.03); }
.voice-mic.rec { animation: pulse 1.5s ease-out infinite; }
@keyframes pulse {
  0% { box-shadow: inset 0 0 0 1px rgba(255,253,247,.6), 0 0 0 0 rgba(156,42,27,.45); }
  70% { box-shadow: inset 0 0 0 1px rgba(255,253,247,.6), 0 0 0 22px rgba(156,42,27,0); }
  100% { box-shadow: inset 0 0 0 1px rgba(255,253,247,.6), 0 0 0 0 rgba(156,42,27,0); }
}
.voice-hint { font-size: var(--fs-sm); color: var(--ink-3); }
.voice-heard {
  min-height: 44px; font-size: var(--fs-md); color: var(--ink);
  padding: var(--sp-3); border-radius: var(--r-xs);
  background: var(--paper-2); border: 1px solid var(--line-strong); width: 100%;
  text-align: left; line-height: 1.55;
}
.voice-heard:empty::before { content: '说完「张三结婚八百」这种话，识别结果会出现在这里'; color: var(--ink-4); font-size: var(--fs-sm); }
.voice-example { font-size: 11px; color: var(--ink-4); text-align: left; letter-spacing: .02em; }

/* ---------- 响应式（手机：竖排与小标先收起来，版面优先给数字） ---------- */
@media (max-width: 760px) {
  :root { --nav-h: 58px; --fs-2xl: 34px; --fs-xl: 26px; --fs-display: 38px; }
  .topbar { padding: 0 var(--sp-4); gap: var(--sp-2); }
  .brand-seal { width: 32px; height: 32px; flex: 0 0 32px; font-size: 18px; }
  .brand-sub { display: none; }
  .brand-mark { letter-spacing: .18em; }
  .topbar .search-trigger .kbd { display: none; }
  .topbar-new { display: none; }
  .tabs { display: none; }
  main { padding: var(--sp-4) var(--sp-4) 132px; }

  .view > .section:first-child > .section-head h2 { font-size: var(--fs-lg); letter-spacing: .12em; }

  /* 汇总卡在窄屏改成一列三行：标签横回来、数字靠右，省高度 */
  .summary { grid-template-columns: 1fr; margin: 4px; }
  .summary > div {
    display: flex; align-items: baseline; gap: var(--sp-3);
    padding: var(--sp-3) var(--sp-4);
  }
  .summary .label { writing-mode: horizontal-tb; letter-spacing: .12em; flex: 0 0 64px; }
  .summary .value { margin-left: auto; font-size: var(--fs-lg); letter-spacing: 0; }
  .summary .foot { margin-left: var(--sp-2); flex: 0 0 auto; white-space: nowrap; }

  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .photo-row { grid-template-columns: 1fr; }

  /* 手机上改成贴在底栏上方的操作条：浮在角上的圆钮会挡住列表里的金额 */
  .btn-dock {
    left: 0; right: 0; bottom: calc(var(--nav-h) - 2px);
    flex-direction: row; align-items: center; justify-content: center; gap: var(--sp-3);
    padding: 8px var(--sp-4);
    background: rgba(244, 238, 225, .97); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line-strong);
  }
  .btn-dock .btn { flex: 1 1 0; max-width: 190px; padding: 9px 12px; box-shadow: 0 1px 0 var(--line); }

  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr);
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: rgba(244, 238, 225, .98); backdrop-filter: blur(12px);
    border-top: 3px double var(--line-strong);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar button {
    border: 0; background: transparent; color: var(--ink-4);
    padding: 9px 2px 8px; font-size: 11px; letter-spacing: .08em;
    display: grid; gap: 2px; justify-items: center;
  }
  .tabbar button[aria-selected="true"] { color: var(--red); font-weight: 600; }
  .tabbar .ico { font-family: var(--serif); font-size: 16px; line-height: 1; }

  .row { padding: var(--sp-3); gap: var(--sp-2); }
  .avatar { width: 30px; height: 30px; flex: 0 0 30px; font-size: var(--fs-base); }
  .row .amt { font-size: var(--fs-sm); }
  .modal { max-height: 92vh; }
  .modal-body { padding: var(--sp-4); }
  .search-modal .modal-body { padding: 0; }
  .search-results { max-height: 62vh; }
  .trend { height: 150px; }
  .sheet { padding: var(--sp-4); }
  /* 窄屏放不下五列，占比柱先让位，剩下的数字不挤 */
  .w-bar { display: none; }
  .section-head { flex-wrap: wrap; row-gap: var(--sp-2); }
  .section-head .hint { order: 9; flex: 1 1 100%; }
  .voice-mic { width: 66px; height: 66px; font-size: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

<script>
/* js/store.js */
/* 礼簿 · 本地存储层：localStorage 读写、导入导出、示例数据 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) { module.exports = factory(); }
  else { root.LB = root.LB || {}; Object.assign(root.LB, factory()); }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var KEY = 'libu.v1';
  var mem = null; // localStorage 不可用时的兜底（Safari 隐私模式等）

  function hasLS() {
    try {
      if (typeof localStorage === 'undefined') return false;
      localStorage.setItem('__lb_probe', '1');
      localStorage.removeItem('__lb_probe');
      return true;
    } catch (e) { return false; }
  }
  var LS_OK = hasLS();

  function emptyDB() {
    return { events: [], gifts: [], trash: [], meta: { version: 1, updatedAt: new Date().toISOString() } };
  }

  function load() {
    if (mem) return mem;
    if (!LS_OK) return (mem = emptyDB());
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (!raw) return (mem = emptyDB());
    try {
      var db = JSON.parse(raw);
      db.events = Array.isArray(db.events) ? db.events : [];
      db.gifts = Array.isArray(db.gifts) ? db.gifts : [];
      db.trash = Array.isArray(db.trash) ? db.trash : [];
      db.meta = db.meta || { version: 1 };
      mem = db;
      purgeExpired(); // 超过 30 天的回收站条目顺手清掉，不等用户点
      return mem;
    } catch (e) {
      // 数据坏了不要静默覆盖，留个痕迹给设置页显示
      mem = emptyDB();
      mem.meta.corrupt = true;
      return mem;
    }
  }

  function save(db) {
    mem = db;
    db.meta = db.meta || { version: 1 };
    db.meta.updatedAt = new Date().toISOString();
    if (!LS_OK) return false;
    try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
    catch (e) { return false; }
  }

  function uid(prefix) {
    return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
  }

  function today() {
    var d = new Date();
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
  }

  /* ---------- 事件 ---------- */
  function addEvent(ev) {
    var db = load();
    var row = {
      id: ev.id || uid('e'),
      type: ev.type || '其他',
      title: String(ev.title || '').trim() || (ev.type || '事件'),
      date: ev.date || today(),
      note: ev.note || ''
    };
    db.events.push(row);
    save(db);
    return row;
  }

  function updateEvent(id, patch) {
    var db = load();
    var row = db.events.filter(function (e) { return e.id === id; })[0];
    if (!row) return null;
    Object.keys(patch).forEach(function (k) { row[k] = patch[k]; });
    save(db);
    return row;
  }

  function removeEvent(id) {
    var db = load();
    var row = db.events.filter(function (e) { return e.id === id; })[0];
    if (!row) return;
    db.events = db.events.filter(function (e) { return e.id !== id; });
    // 顺手把挂在这个事件上的礼金解绑，避免详情页出现指向空事件的孤儿；
    // 记下被解绑的 id，撤销时才能原样接回去
    var unbound = [];
    db.gifts.forEach(function (g) {
      if (g.eventId === id) { g.eventId = null; unbound.push(g.id); }
    });
    db.trash.push({ kind: 'event', at: new Date().toISOString(), unbound: unbound, row: row });
    save(db);
  }

  function getEvent(id) {
    return load().events.filter(function (e) { return e.id === id; })[0] || null;
  }

  /* ---------- 礼金记录 ---------- */
  function addGift(g) {
    var db = load();
    var row = {
      id: g.id || uid('g'),
      person: String(g.person || '').trim(),
      relation: g.relation || '其他',
      direction: g.direction === '送礼' ? '送礼' : '收礼',
      amount: Math.round(Number(g.amount) * 100) / 100,
      occasion: g.occasion || '其他',
      eventId: g.eventId || null,
      date: g.date || today(),
      note: g.note || ''
    };
    db.gifts.push(row);
    save(db);
    return row;
  }

  function updateGift(id, patch) {
    var db = load();
    var row = db.gifts.filter(function (g) { return g.id === id; })[0];
    if (!row) return null;
    Object.keys(patch).forEach(function (k) {
      row[k] = k === 'amount' ? Math.round(Number(patch[k]) * 100) / 100 : patch[k];
    });
    save(db);
    return row;
  }

  function removeGift(id) {
    var db = load();
    var row = db.gifts.filter(function (g) { return g.id === id; })[0];
    if (!row) return;
    db.gifts = db.gifts.filter(function (g) { return g.id !== id; });
    db.trash.push({ kind: 'gift', at: new Date().toISOString(), row: row });
    save(db);
  }

  /* ---------- 回收站（30 天内可捞回） ---------- */
  var TRASH_DAYS = 30;
  var TRASH_MAX = 200; // 兜底：条数太多就把最老的挤掉，别把 localStorage 撑爆

  function purgeExpired() {
    var db = mem;
    if (!db || !db.trash || !db.trash.length) return;
    var cut = Date.now() - TRASH_DAYS * 86400000;
    var keep = db.trash.filter(function (t) {
      var t0 = Date.parse(t && t.at);
      return isNaN(t0) ? false : t0 >= cut;
    });
    if (keep.length > TRASH_MAX) keep = keep.slice(keep.length - TRASH_MAX);
    if (keep.length === db.trash.length) return;
    db.trash = keep;
    // load() 里调用时不能回头再 save（会递归），这里直接写盘
    if (LS_OK) {
      try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* 满了就算了，报错由 save 统一处理 */ }
    }
  }

  function trashList() {
    var db = load();
    return db.trash.slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; });
  }

  /** 撤销最近一次删除：把回收站里最新的一条塞回原处 */
  function undoLast() {
    var db = load();
    if (!db.trash.length) return null;
    var sorted = db.trash.slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; });
    var top = sorted[0];
    if (!top || !top.row) return null;
    db.trash = db.trash.filter(function (t) { return t !== top; });
    var row = top.row;
    if (top.kind === 'event') {
      if (db.events.some(function (e) { return e.id === row.id; })) return null;
      db.events.push(row);
    } else {
      if (db.gifts.some(function (g) { return g.id === row.id; })) return null;
      db.gifts.push(row);
    }
    save(db);
    return top;
  }

  /** 从回收站恢复指定条目 */
  function restoreFromTrash(at) {
    var db = load();
    var top = db.trash.filter(function (t) { return t.at === at; })[0];
    if (!top || !top.row) return null;
    db.trash = db.trash.filter(function (t) { return t !== top; });
    var row = top.row;
    if (top.kind === 'event') {
      if (db.events.some(function (e) { return e.id === row.id; })) return null;
      db.events.push(row);
      // 删事件时被解绑的礼金接回去，别让用户再手动点一次
      var unbound = {};
      (top.unbound || []).forEach(function (gid) { unbound[gid] = 1; });
      db.gifts.forEach(function (g) {
        if (g.eventId === null && unbound[g.id]) g.eventId = row.id;
      });
    } else {
      if (db.gifts.some(function (g) { return g.id === row.id; })) return null;
      db.gifts.push(row);
    }
    save(db);
    return top;
  }

  /** 彻底清空回收站 */
  function emptyTrash() {
    var db = load();
    db.trash = [];
    save(db);
  }

  function giftsOfEvent(eventId) {
    return load().gifts.filter(function (g) { return g.eventId === eventId; });
  }

  /* ---------- 批量 ---------- */
  function addGiftsBulk(list) {
    var db = load();
    var added = list.map(function (g) {
      var row = {
        id: g.id || uid('g'),
        person: String(g.person || '').trim(),
        relation: g.relation || '其他',
        direction: g.direction === '送礼' ? '送礼' : '收礼',
        amount: Math.round(Number(g.amount) * 100) / 100,
        occasion: g.occasion || '其他',
        eventId: g.eventId || null,
        date: g.date || today(),
        note: g.note || ''
      };
      db.gifts.push(row);
      return row;
    });
    save(db);
    return added;
  }

  /* ---------- 导入导出 ---------- */
  function exportJSON() {
    var db = load();
    return JSON.stringify({ app: '礼簿', version: 1, exportedAt: new Date().toISOString(), events: db.events, gifts: db.gifts, trash: db.trash }, null, 2);
  }

  /** 导入：既认自己导出的 JSON，也认 {events,gifts} 裸对象；返回 {ok, events, gifts, warning} */
  function importJSON(text) {
    var obj;
    try { obj = JSON.parse(text); } catch (e) { return { ok: false, error: '不是合法的 JSON 文件' }; }
    if (!obj || typeof obj !== 'object') return { ok: false, error: '文件内容不是礼簿数据' };
    var events = Array.isArray(obj.events) ? obj.events : null;
    var gifts = Array.isArray(obj.gifts) ? obj.gifts : null;
    if (!events && !gifts) return { ok: false, error: '文件里找不到 events / gifts 字段' };
    var evs = (events || []).filter(function (e) { return e && typeof e === 'object'; }).map(function (e) {
      return { id: e.id || uid('e'), type: e.type || '其他', title: e.title || '事件', date: e.date || today(), note: e.note || '' };
    });
    var gs = (gifts || []).filter(function (g) { return g && typeof g === 'object' && g.person; }).map(function (g) {
      return {
        id: g.id || uid('g'),
        person: String(g.person).trim(),
        relation: g.relation || '其他',
        direction: g.direction === '送礼' ? '送礼' : '收礼',
        amount: Math.round(Number(g.amount || 0) * 100) / 100,
        occasion: g.occasion || '其他',
        eventId: g.eventId || null,
        date: g.date || today(),
        note: g.note || ''
      };
    });
    // 事件 id 对不上的外键要清空，否则详情页永远查不到东西
    var ids = {};
    evs.forEach(function (e) { ids[e.id] = 1; });
    var orphan = 0;
    gs.forEach(function (g) { if (g.eventId && !ids[g.eventId]) { g.eventId = null; orphan++; } });
    return { ok: true, events: evs, gifts: gs, orphan: orphan };
  }

  /** 合并导入：同 id 覆盖，其余追加 */
  function mergeImport(events, gifts) {
    var db = load();
    var evMap = {};
    db.events.forEach(function (e) { evMap[e.id] = e; });
    events.forEach(function (e) { evMap[e.id] = e; });
    var gMap = {};
    db.gifts.forEach(function (g) { gMap[g.id] = g; });
    gifts.forEach(function (g) { gMap[g.id] = g; });
    db.events = Object.keys(evMap).map(function (k) { return evMap[k]; });
    db.gifts = Object.keys(gMap).map(function (k) { return gMap[k]; });
    save(db);
    return db;
  }

  function replaceAll(events, gifts) {
    var db = emptyDB();
    db.events = events || [];
    db.gifts = gifts || [];
    save(db);
    return db;
  }

  function clearAll() {
    save(emptyDB());
  }

  function toCSV(rows) {
    var head = ['日期', '人名', '关系', '方向', '金额', '场合', '事件', '备注'];
    var lines = [head.join(',')];
    rows.forEach(function (g) {
      var ev = g.eventId ? getEvent(g.eventId) : null;
      var cells = [g.date, g.person, g.relation, g.direction, g.amount, g.occasion, ev ? ev.title : '', g.note || ''];
      lines.push(cells.map(function (c) {
        var s = String(c === null || c === undefined ? '' : c);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(','));
    });
    // BOM 是给 Excel 认 UTF-8 用的，少了它中文全是乱码
    return '\ufeff' + lines.join('\r\n');
  }

  /* ---------- 示例数据 ---------- */
  /** 今天往前 n 天（示例数据要用「刚满一年的日子」才照得出提醒效果） */
  function ago(n) {
    var d = new Date();
    d.setDate(d.getDate() - n);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function demoData() {
    var y = new Date().getFullYear();
    var ev = [
      { id: 'e_demo1', type: '结婚', title: '表弟婚礼', date: y + '-05-01', note: '海宁' },
      { id: 'e_demo2', type: '满月酒', title: '小宝满月', date: y + '-07-12', note: '' },
      { id: 'e_demo3', type: '乔迁', title: '老王新居', date: y + '-03-18', note: '' }
    ];
    var g = [
      { person: '王建国', relation: '亲戚', direction: '收礼', amount: 2000, occasion: '结婚', eventId: 'e_demo1', date: y + '-05-01', note: '大舅' },
      { person: '李强', relation: '同事', direction: '收礼', amount: 600, occasion: '结婚', eventId: 'e_demo1', date: y + '-05-01', note: '微信红包' },
      { person: '张伟', relation: '朋友', direction: '收礼', amount: 800, occasion: '满月酒', eventId: 'e_demo2', date: y + '-07-12', note: '' },
      { person: '陈晓', relation: '同学', direction: '送礼', amount: 1000, occasion: '结婚', eventId: null, date: y + '-04-20', note: '陈晓婚礼' },
      { person: '李强', relation: '同事', direction: '送礼', amount: 500, occasion: '乔迁', eventId: 'e_demo3', date: y + '-03-18', note: '' },
      { person: '王建国', relation: '亲戚', direction: '送礼', amount: 1200, occasion: '升学', eventId: null, date: (y - 1) + '-08-15', note: '他儿子升学' },
      { person: '孙浩', relation: '朋友', direction: '收礼', amount: 888.8, occasion: '乔迁', eventId: 'e_demo3', date: y + '-03-18', note: '转账' },
      // 下面两笔故意落在一年前：这样「重要日期提醒」和「回礼助手」一打开就有东西看
      { person: '周婶', relation: '邻居', direction: '收礼', amount: 800, occasion: '满月酒', eventId: null, date: ago(352), note: '她家小宝满月' },
      { person: '赵敏', relation: '邻居', direction: '送礼', amount: 300, occasion: '白事', eventId: null, date: ago(360), note: '' }
    ];
    var gifts = g.map(function (x, i) {
      var row = JSON.parse(JSON.stringify(x));
      row.id = 'g_demo' + i;
      return row;
    });
    replaceAll(ev, gifts);
  }

  return {
    KEY: KEY,
    LS_OK: function () { return LS_OK; },
    load: load,
    save: save,
    uid: uid,
    today: today,
    addEvent: addEvent,
    updateEvent: updateEvent,
    removeEvent: removeEvent,
    getEvent: getEvent,
    addGift: addGift,
    updateGift: updateGift,
    removeGift: removeGift,
    giftsOfEvent: giftsOfEvent,
    addGiftsBulk: addGiftsBulk,
    trashList: trashList,
    undoLast: undoLast,
    restoreFromTrash: restoreFromTrash,
    emptyTrash: emptyTrash,
    TRASH_DAYS: TRASH_DAYS,
    exportJSON: exportJSON,
    importJSON: importJSON,
    mergeImport: mergeImport,
    replaceAll: replaceAll,
    clearAll: clearAll,
    toCSV: toCSV,
    demoData: demoData
  };
});
