  };

  function doImport() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = function () {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var res = store.importJSON(String(reader.result || ''));
        if (!res.ok) return ui.toast(res.error);
        showImportPlan(res, file.name);
      };
      reader.onerror = function () { ui.toast('文件读不出来，换一个试试'); };
      reader.readAsText(file, 'utf-8');
    };
    input.click();
  }

  function showImportPlan(res, filename) {
    var db = store.load();
    var warn = res.orphan ? '<div class="banner" style="margin-top:var(--sp-3)">有 ' + res.orphan +
      ' 笔记录挂在找不到的事件上，已自动改成「不关联事件」，数据不会丢。</div>' : '';

    ui.openModal({
      title: '导入 ' + filename,
      body: '<div style="font-size:var(--fs-sm);line-height:1.8">' +
        '文件里有 <strong class="num">' + res.gifts.length + '</strong> 笔记录、' +
        '<strong class="num">' + res.events.length + '</strong> 个事件。<br>' +
        '你现有 <strong class="num">' + db.gifts.length + '</strong> 笔记录、' +
        '<strong class="num">' + db.events.length + '</strong> 个事件。' +
        '</div>' + warn,
      foot: '<button class="btn ghost" data-modal-close>取消</button>' +
            '<button class="btn" data-merge>合并进来</button>' +
            '<button class="btn primary" data-replace>覆盖现有</button>',
      onMount: function (box) {
        box.querySelector('[data-merge]').addEventListener('click', function () {
          store.mergeImport(res.events, res.gifts);
          ui.closeModal(); APP.refresh(); ui.toast('已合并导入'); APP.go('home');
        });
        box.querySelector('[data-replace]').addEventListener('click', function () {
          ui.confirm('确定覆盖？', '现有 ' + db.gifts.length + ' 笔记录会被文件内容替换，无法撤销。', '确认覆盖').then(function (ok) {
            if (!ok) return;
            store.replaceAll(res.events, res.gifts);
            ui.closeModal(); APP.refresh(); ui.toast('已覆盖导入'); APP.go('home');
          });
        });
      }
    });
  }

  LB.ui.pages.settings = page;
})();

<script>
/* js/remind.js */
/**
 * 礼簿 · remind.js —— 重要日期提醒（纯函数）
 * 只从已有数据里推导「人情节点」，不新建任何字段、不编造社交规则：
 *   return   你还欠着人情的那个人，他最近一次给你随礼的日子快满周年了
 *   memorial 白事满周年（周年祭），提前提醒
 *   event    事件（婚礼/满月/乔迁…）满周年
 * 纪律：不读 DOM / localStorage / window，不修改入参。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) { module.exports = factory(); }
  else { root.LB = root.LB || {}; Object.assign(root.LB, factory()); }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var DAY = 86400000;

  /** 'YYYY-MM-DD' -> {y,m,d}；不合法返回 null（脏日期一律不算节点，宁可少提醒） */
  function parseDate(s) {
    if (typeof s !== 'string' || s.length < 10) return null;
    var y = parseInt(s.slice(0, 4), 10);
    var m = parseInt(s.slice(5, 7), 10);
    var d = parseInt(s.slice(8, 10), 10);
    if (!y || !m || !d) return null;
    if (m < 1 || m > 12 || d < 1 || d > 31) return null;
    return { y: y, m: m, d: d };
  }

  /** UTC 天数，避免夏令时/时区把差值算成 0.958 天 */
  function dayNumber(y, m, d) { return Math.floor(Date.UTC(y, m - 1, d) / DAY); }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  /** 两个日期相差几天（b - a），任一不合法返回 null */
  function daysBetween(a, b) {
    var pa = parseDate(a), pb = parseDate(b);
    if (!pa || !pb) return null;
    return dayNumber(pb.y, pb.m, pb.d) - dayNumber(pa.y, pa.m, pa.d);
  }

  /** 某个月日在 target 年是否成立（2 月 29 日在平年落到 2 月 28 日） */
  function inYear(y, m, d) {
    if (m === 2 && d === 29 && !(y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0))) d = 28;
    return { y: y, m: m, d: d };
  }

  /**
   * 下一次周年（含今天）
   * @returns {{date:string, daysLeft:number, years:number}|null}
   */
  function nextAnniversary(dateStr, todayStr) {
    var p = parseDate(dateStr), t = parseDate(todayStr);
    if (!p || !t) return null;
    var now = dayNumber(t.y, t.m, t.d);
    for (var k = 0; k <= 2; k++) {
      var yy = inYear(t.y + k, p.m, p.d);
      var dn = dayNumber(yy.y, yy.m, yy.d);
      if (dn >= now) {
        return {
          date: yy.y + '-' + pad(yy.m) + '-' + pad(yy.d),
          daysLeft: dn - now,
          years: yy.y - p.y
        };
      }
    }
    return null;
  }

  function sumOf(rows, dir) {
    return rows.reduce(function (s, g) {
      return s + (g.direction === dir ? (Number(g.amount) || 0) : 0);
    }, 0);
  }

  function round2(x) { return Math.round(x * 100) / 100; }

  /** 按人聚合，只挑出「你还欠人情」的那几位（收 > 送） */
  function debtors(gifts) {
    var by = {};
    (gifts || []).forEach(function (g) {
      if (!g || !g.person) return;
      var k = String(g.person).trim();
      if (!k) return;
      (by[k] = by[k] || []).push(g);
    });
    var out = [];
    Object.keys(by).forEach(function (name) {
      var rows = by[name];
      var net = round2(sumOf(rows, '收礼') - sumOf(rows, '送礼'));
      if (net <= 0) return;
      // 只看收礼里最近的那一笔：那才是「他办事我给你面子」的起点
      var received = rows.filter(function (g) { return g.direction === '收礼' && parseDate(g.date); });
      if (!received.length) return;
      received.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      out.push({ person: name, net: net, last: received[0] });
    });
    return out;
  }

  /**
   * 未来 horizon 天内的人情节点
   * @param {Array} gifts
   * @param {Array} events
   * @param {string} todayStr 'YYYY-MM-DD'
   * @param {{days?:number, includeEvents?:boolean}} [opts]
   */
  function upcoming(gifts, events, todayStr, opts) {
    opts = opts || {};
    var horizon = typeof opts.days === 'number' ? opts.days : 60;
    var includeEvents = opts.includeEvents !== false;
    var out = [];

    debtors(gifts || []).forEach(function (d) {
      var a = nextAnniversary(d.last.date, todayStr);
      if (!a || a.years < 1 || a.daysLeft > horizon) return;
      out.push({
        kind: 'return',
        key: 'return:' + d.person,
        person: d.person,
        date: a.date,
        daysLeft: a.daysLeft,
        years: a.years,
        amount: round2(Number(d.last.amount) || 0),
        net: d.net,
        occasion: d.last.occasion || '',
        title: d.person + ' 上次随礼满 ' + a.years + ' 年',
        why: '你还欠他 ' + round2(d.net) + ' 元人情'
      });
    });

    (gifts || []).forEach(function (g) {
      if (!g || g.occasion !== '白事' || !g.person) return;
      var a = nextAnniversary(g.date, todayStr);
      if (!a || a.years < 1 || a.daysLeft > horizon) return;
      out.push({
        kind: 'memorial',
        key: 'memorial:' + g.person + ':' + a.date,
        person: String(g.person).trim(),
        date: a.date,
        daysLeft: a.daysLeft,
        years: a.years,
        amount: round2(Number(g.amount) || 0),
        occasion: '白事',
        title: g.person + ' 家白事满 ' + a.years + ' 周年',
        why: '周年祭，看看要不要再走动一下'
      });
    });

    if (includeEvents) {
      (events || []).forEach(function (e) {
        if (!e || !e.id) return;
        var a = nextAnniversary(e.date, todayStr);
        if (!a || a.years < 1 || a.daysLeft > horizon) return;
        out.push({
          kind: 'event',
          key: 'event:' + e.id + ':' + a.date,
          person: '',
          eventId: e.id,
          date: a.date,
          daysLeft: a.daysLeft,
          years: a.years,
          title: (e.title || e.type || '事件') + ' 满 ' + a.years + ' 周年',
          why: e.type || ''
        });
      });
    }

    // 同一个人同一天只留一条：白事 > 回礼 > 事件（白事最不该漏）
    var PRIORITY = { memorial: 0, return: 1, event: 2 };
    var best = {};
    out.forEach(function (it) {
      var k = it.date + '|' + (it.person || it.eventId);
      var cur = best[k];
      if (!cur || PRIORITY[it.kind] < PRIORITY[cur.kind]) best[k] = it;
    });
    out = Object.keys(best).map(function (k) { return best[k]; });

    out.sort(function (a, b) {
      if (a.daysLeft !== b.daysLeft) return a.daysLeft - b.daysLeft;
      return a.kind < b.kind ? -1 : 1;
    });
    return out;
  }

  return {
    parseDate: parseDate,
    daysBetween: daysBetween,
    nextAnniversary: nextAnniversary,
    debtors: debtors,
    upcoming: upcoming
  };
});

</script>
<script>
/* js/photo.js */
/**
 * 礼簿 · photo.js —— 拍照参照 + OCR 辅助
 *
 * 用途：把纸质礼簿摊在桌上，用手机拍一张放在录入框旁边，照着大图敲——比来回抬眼快。
 * OCR 是"辅助"不是"替代"：识别结果会填进批量框，由人核对过再入库，绝不直接写数据。
 * 照片只在内存里当参照，不写 localStorage（一张几 MB，很容易把配额撑爆）。
 */
(function () {
  'use strict';
  var LB = window.LB, ui = LB.ui;

  var TESS_CDN = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  var tesseractLoading = null;
  var workerPromise = null;

  /** 按需加载 tesseract，加载一次就复用；失败返回 null 而不是抛错 */
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (tesseractLoading) return tesseractLoading;
    tesseractLoading = new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = TESS_CDN;
      s.async = true;
      s.onload = function () { resolve(window.Tesseract || null); };
      s.onerror = function () { resolve(null); };
      document.head.appendChild(s);
    });
    return tesseractLoading;
  }

  function getWorker(onProgress) {
    if (workerPromise) return workerPromise;
    workerPromise = loadTesseract().then(function (T) {
      if (!T) return null;
      return T.createWorker('chi_sim', 1, {
        logger: function (m) {
          if (onProgress && m && typeof m.progress === 'number') onProgress(m);
        }
      });
    }).catch(function () { return null; });
    return workerPromise;
  }

  /**
   * 面板 HTML：扔进任何弹窗里都能用
   * @param {{label?:string, textId?:string}} [opt]
   */
  function panelHTML(opt) {
    opt = opt || {};
    var label = opt.label || '纸质礼簿参照';
    var textId = opt.textId ? ' id="' + opt.textId + '"' : '';
    return '' +
      '<div class="photo-row" data-photo>' +
        '<div>' +
          '<label style="display:block;font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:6px">' + ui.esc(label) + '</label>' +
          '<div class="photo-drop" data-drop>' +
            '<div class="big" aria-hidden="true">照</div>' +
            '<div>拍一张 / 选一张<br><span style="font-size:11px">只看不用存，不占空间</span></div>' +
            '<button class="btn sm" type="button" data-pick style="margin-top:6px">选照片</button>' +
            '<input type="file" accept="image/*" capture="environment" data-file hidden>' +
          '</div>' +
          '<div data-shot hidden>' +
            '<div class="photo-shot">' +
              '<img data-img alt="参照图">' +
              '<button class="zoom" type="button" data-zoom>放大看</button>' +
            '</div>' +
            '<div class="ocr-bar" data-ocr-bar><span class="dot"></span><span data-ocr-msg>已就绪，可以照着图敲</span></div>' +
            '<div class="inline" style="margin-top:var(--sp-2)">' +
              '<button class="btn sm" type="button" data-ocr>识别文字</button>' +
              '<button class="btn sm ghost" type="button" data-retake>换一张</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div>' +
          '<label style="display:block;font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:6px">照这里敲（OCR 认出来的也会填进来，核对后入库）</label>' +
          '<textarea class="textarea" data-text' + textId + ' style="min-height:170px" placeholder="张三 800&#10;李四 500 结婚&#10;王五 1000 微信红包"></textarea>' +
          '<div style="font-size:11px;color:var(--ink-4);margin-top:6px">识别不准是常态——手写字、竖排、光线暗都会翻车，所以一定要看一眼再记。</div>' +
        '</div>' +
      '</div>';
  }

  /**
   * 绑定面板行为
   * @param {HTMLElement} scope 含 [data-photo] 的容器
   * @param {{onText?:function(string)}} [opt]
   */
  function bind(scope, opt) {
    opt = opt || {};
    var root = scope.querySelector('[data-photo]');
    if (!root || root.dataset.bound) return;
    root.dataset.bound = '1';

    var drop = root.querySelector('[data-drop]');
    var file = root.querySelector('[data-file]');
    var shot = root.querySelector('[data-shot]');
    var img = root.querySelector('[data-img]');
    var bar = root.querySelector('[data-ocr-bar]');
    var msg = root.querySelector('[data-ocr-msg]');
    var text = root.querySelector('[data-text]');
    var ocrBtn = root.querySelector('[data-ocr]');
    var currentURL = '';

    function setURL(url) {
      if (currentURL) URL.revokeObjectURL(currentURL);
      currentURL = url;
      img.src = url;
    }

    function accept(f) {
      if (!f) return;
      if (!/^image\//.test(f.type)) return ui.toast('这不是图片文件');
      if (f.size > 12 * 1024 * 1024) return ui.toast('图太大了（超过 12MB），换一张小点的');
      setURL(URL.createObjectURL(f));
      drop.hidden = true;
      shot.hidden = false;
      bar.className = 'ocr-bar done';
      msg.textContent = '已就绪，可以照着图敲';
    }

    root.querySelector('[data-pick]').addEventListener('click', function () { file.click(); });
    file.addEventListener('change', function () { accept(file.files && file.files[0]); });

    // 拖拽：桌面端从文件夹里拖进来更快
    ['dragenter', 'dragover'].forEach(function (t) {
      drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (t) {
      drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (e) {
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      accept(f);
    });

    root.querySelector('[data-zoom]').addEventListener('click', function (e) {
      e.preventDefault();
      openViewer(img.src);
    });
    root.querySelector('[data-retake]').addEventListener('click', function () {
      shot.hidden = true;
      drop.hidden = false;
      file.value = '';
      setURL('');
    });

    ocrBtn.addEventListener('click', function () {
      if (!img.src) return;
      if (!text.value.trim()) text.value = '';
      ocrBtn.disabled = true;
      bar.className = 'ocr-bar';
      msg.textContent = '第一次要点时间（要下约 15MB 中文模型，需要联网）…';

      getWorker(function (m) {
        if (m.status === 'loading tesseract core' || m.status === 'initializing tesseract') msg.textContent = '加载识别引擎…';
        else if (m.status === 'loading language traineddata') msg.textContent = '下载中文模型 ' + Math.round((m.progress || 0) * 100) + '%…';
        else if (m.status === 'recognizing text') msg.textContent = '识别中 ' + Math.round((m.progress || 0) * 100) + '%…';
      }).then(function (w) {
        if (!w) throw new Error('nocdn');
        return w.recognize(img.src);
      }).then(function (res) {
        var out = String((res && res.data && res.data.text) || '')
          .replace(/[ \t]+/g, ' ')
          .split('\n')
          .map(function (l) { return l.trim(); })
          .filter(Boolean)
          .join('\n');
        if (!out) {
          bar.className = 'ocr-bar fail';
          msg.textContent = '这张没认出字来，换个角度或亮点的地方重拍';
          ocrBtn.disabled = false;
          return;
        }
        text.value = text.value.trim() ? (text.value.trim() + '\n' + out) : out;
        bar.className = 'ocr-bar done';
        msg.textContent = '认出来了，已填进右边，务必核对一遍';
        ocrBtn.disabled = false;
        if (opt.onText) opt.onText(text.value);
      }).catch(function () {
        bar.className = 'ocr-bar fail';
        msg.textContent = '识别引擎加载失败（没联网或 CDN 被挡），照着图敲也一样快';
        ocrBtn.disabled = false;
      });
    });

    if (text && opt.onText) {
      text.addEventListener('input', function () { if (opt.onText) opt.onText(text.value); });
    }

    root.__dispose = function () {
      if (currentURL) URL.revokeObjectURL(currentURL);
      currentURL = '';
    };
  }

  /* ---------- 全屏看图 ---------- */

  function openViewer(src) {
    var v = document.getElementById('viewer');
    var im = document.getElementById('viewer-img');
    if (!v || !im || !src) return;
    im.src = src;
    v.classList.add('open');
  }

  function closeViewer() {
    var v = document.getElementById('viewer');
    var im = document.getElementById('viewer-img');
    if (!v) return;
    v.classList.remove('open');
    if (im) im.removeAttribute('src');
  }

  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-viewer-close]') || e.target.id === 'viewer') closeViewer();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeViewer();
  });

  LB.photo = { panelHTML: panelHTML, bind: bind, openViewer: openViewer, closeViewer: closeViewer };
})();

</script>
<script>
/* js/voice.js */
/**
 * 礼簿 · voice.js —— 语音快速记账
 * 说「张三结婚八百」，转成文字后交给 parse.js 的同一套解析器，再走批量入库。
 * 不支持语音的浏览器（Firefox / 部分安卓）自动降级成手动输入，不报错、不装死。
 */
(function () {
  'use strict';
  var LB = window.LB, ui = LB.ui, store = LB;

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var hasSR = !!SR;

  function open() {
    var heard = '';
    var parsed = null;

    var body =
      '<div class="voice-wrap">' +
        '<div class="voice-stage">' +
          '<button class="voice-mic" type="button" data-mic aria-label="开始说话">说一句</button>' +
          '<div class="voice-hint" data-hint>' +
            (hasSR ? '点一下开始说，说完点「停」' : '这个浏览器不支持语音识别，直接打字也一样快') +
          '</div>' +
        '</div>' +
        '<div class="voice-heard" data-heard></div>' +
        '<div class="voice-example">' +
          (hasSR
            ? '可以这么说：「张三结婚八百」「李四满月酒五百微信红包」「王五乔迁一千」'
            : '格式：「张三 800 结婚」「李四 500 满月酒 微信红包」') +
        '</div>' +
        (hasSR ? '' : '<div class="field" style="margin-top:var(--sp-4)">' +
          '<label>手动输入</label><textarea class="textarea" data-manual style="min-height:110px" ' +
          'placeholder="张三 800 结婚&#10;李四 500 满月酒"></textarea></div>') +
        '<div id="v-preview" class="parse-preview"></div>' +
        '<div class="grid-2" style="margin-top:var(--sp-4)">' +
          '<div class="field" style="margin-bottom:0"><label>默认收 / 送</label>' + ui.segHTML('v-direction', LB.DIRECTIONS, '收礼') + '</div>' +
          '<div class="field" style="margin-bottom:0"><label>日期</label><input class="input" id="v-date" type="date" value="' + ui.esc(store.today()) + '"></div>' +
        '</div>' +
      '</div>';

    ui.openModal({
      title: '语音记一笔',
      body: body,
      foot: '<button class="btn" data-modal-close>取消</button>' +
            '<button class="btn primary" data-commit disabled>记下来</button>',
      onMount: function (box) {
        var mic = box.querySelector('[data-mic]');
        var hint = box.querySelector('[data-hint]');
        var heardBox = box.querySelector('[data-heard]');
        var preview = box.querySelector('#v-preview');
        var commit = box.querySelector('[data-commit]');
        var manual = box.querySelector('[data-manual]');
        var rec = null;
        var listening = false;

        function paint() {
          heardBox.textContent = heard || '';
        }

        function doParse() {
          var text = heard || (manual ? manual.value : '');
          if (!text.trim()) { preview.innerHTML = ''; commit.disabled = true; return; }
          var res = LB.parseBatchText(text, {
            direction: ui.segValue(box, 'v-direction') || '收礼',
            relation: '朋友',
            date: box.querySelector('#v-date').value || store.today(),
            occasion: '其他',
            eventId: null
          });
          parsed = res;
          if (!res.items.length) {
            preview.innerHTML = '<div class="parse-error">' +
              (res.errors.length ? '没听懂：「' + ui.esc(res.errors[0].raw) + '」，' + ui.esc(res.errors[0].reason) : '还没说出内容') +
              '</div>';
            commit.disabled = true;
            return;
          }
          preview.innerHTML =
            '<div style="font-size:var(--fs-sm);margin-bottom:6px"><strong>认出 ' + res.items.length + ' 条</strong>' +
            (res.errors.length ? ' <span style="color:var(--red);font-size:var(--fs-xs)">· ' + res.errors.length + ' 处没听懂</span>' : '') + '</div>' +
            res.items.map(function (it) {
              return '<div class="parse-item">' +
                '<div><strong>' + ui.esc(it.person) + '</strong> <span class="pill">' + ui.esc(it.occasion) + '</span></div>' +
                '<div class="raw">' + ui.esc(it.raw) + '</div>' +
                '<div class="num">' + ui.money(it.amount) + '</div>' +
                '<div><span class="pill ' + (it.direction === '收礼' ? 'red' : 'green') + '">' + ui.esc(it.direction) + '</span></div>' +
              '</div>';
            }).join('');
          commit.disabled = false;
          commit.textContent = '记下这 ' + res.items.length + ' 条';
        }

        if (hasSR) {
          mic.addEventListener('click', function () {
            if (listening) { try { rec.stop(); } catch (e) {} return; }
            try {
              rec = new SR();
            } catch (e) {
              hint.textContent = '语音引擎起不来，直接打字吧';
              return;
            }
            rec.lang = 'zh-CN';
            rec.interimResults = true;
            rec.continuous = false;
            rec.maxAlternatives = 1;

            rec.onstart = function () {
              listening = true;
              mic.classList.add('rec');
              hint.textContent = '在听…说完点一下「停」';
            };
            rec.onresult = function (ev) {
              var finalText = '', interim = '';
              for (var i = ev.resultIndex; i < ev.results.length; i++) {
                var t = ev.results[i][0].transcript;
                if (ev.results[i].isFinal) finalText += t; else interim += t;
              }
              if (finalText) heard = (heard ? heard + '\n' : '') + finalText.trim();
              paint();
              if (interim) { heardBox.textContent = (heard ? heard + ' ' : '') + interim; }
            };
            rec.onerror = function (ev) {
              listening = false;
              mic.classList.remove('rec');
              var map = {
                'not-allowed': '麦克风被浏览器挡住了，点地址栏左边的小锁，把「麦克风」改成允许',
                'no-speech': '没听到声音，再试一次',
                'audio-capture': '没找到麦克风，插一个或者用打字',
                'network': '语音识别要联网，检查一下网络'
              };
              hint.textContent = map[ev.error] || ('语音出错了（' + ev.error + '），改用打字吧');
              doParse();
            };
            rec.onend = function () {
              listening = false;
              mic.classList.remove('rec');
              hint.textContent = heard ? '说完了，核对一下下面的记录' : '点一下开始说';
              paint();
              doParse();
            };
            try { rec.start(); } catch (e) {
              hint.textContent = '语音引擎起不来，直接打字吧';
            }
          });
        } else {
          mic.addEventListener('click', function () { ui.toast('这个浏览器不支持语音，用下面的输入框'); });
        }

        if (manual) manual.addEventListener('input', doParse);
        commit.addEventListener('click', function () {
          if (!parsed || !parsed.items.length) return;
          var rows = parsed.items.map(function (it) {
            return {
              person: it.person, amount: it.amount, relation: it.relation,
              direction: it.direction, occasion: it.occasion || '其他',
              eventId: it.eventId || null, date: it.date, note: it.note
            };
          });
          store.addGiftsBulk(rows);
          ui.closeModal();
          ui.toast('已记下 ' + rows.length + ' 条', {
            action: '撤销',
            onAction: function () {
              var back = store.undoLast();
              APP.afterChange(null);
              ui.toast(back ? '已撤销' : '没东西可撤了');
            }
          });
          APP.afterChange(null);
        });

        // 关弹窗时掐掉麦克风，别让它在后台一直听
        var oldClose = box.querySelector('[data-modal-close]');
        if (oldClose) oldClose.addEventListener('click', function () {
          if (rec && listening) { try { rec.abort(); } catch (e) {} }
        });
      },
      onClose: function () {
        // openModal 的 onClose 拿不到 rec，这里只能靠上面的按钮兜住；
        // Esc 关的情况由 aborted 标记自然结束
      }
    });
  }

  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-action="voice"]')) { e.preventDefault(); open(); }
  });

  LB.openVoice = open;
  LB.hasSpeech = function () { return hasSR; };
})();

</script>
<script>
/* js/search.js */
/**
 * 礼簿 · search.js —— 全局搜索（⌘K / Ctrl+K）
 * 一份输入框同时搜：人名、事件、备注、场合。纯前端，数据全从 store.load() 读。
 */
(function () {
  'use strict';
  var LB = window.LB, ui = LB.ui, store = LB;

  var SEARCH = {};
  var lastQuery = '';
  var hits = [];

  function norm(s) { return String(s === null || s === undefined ? '' : s).toLowerCase(); }

  /** 命中位置包 <mark>，未命中原样返回 */
  function highlight(text, q) {
    var s = String(text || '');
    if (!q) return ui.esc(s);
    var i = s.toLowerCase().indexOf(q);
    if (i < 0) return ui.esc(s);
    return ui.esc(s.slice(0, i)) + '<mark>' + ui.esc(s.slice(i, i + q.length)) + '</mark>' + ui.esc(s.slice(i + q.length));
  }

  /**
   * 搜索：人名权重最高，其次是事件标题，最后才是备注/场合
   * @param {object} db
   * @param {string} q
   * @param {number} [limit]
   */
  SEARCH.run = function (db, q, limit) {
    q = norm(q).trim();
    if (!q) return [];
    var max = limit || 12;

    // 1) 人名：按人聚合，一个人只出一条
    var people = {};
    (db.gifts || []).forEach(function (g) {
      var name = String(g.person || '').trim();
      if (!name) return;
      var p = people[name] = people[name] || { name: name, rows: [], net: 0, count: 0, lastDate: '' };
      p.rows.push(g);
      p.count++;
      p.net += (g.direction === '收礼' ? 1 : -1) * (Number(g.amount) || 0);
      if (!p.lastDate || String(g.date) > p.lastDate) p.lastDate = g.date;
    });

    var out = [];
    Object.keys(people).forEach(function (k) {
      var p = people[k];
      if (norm(p.name).indexOf(q) < 0) return;
      out.push({
        kind: 'person', score: 3,
        title: p.name, sub: p.count + ' 笔 · 上次 ' + ui.dateShort(p.lastDate),
        money: Math.round(p.net * 100) / 100, arg: p.name, q: q
      });
    });

    // 2) 事件
    (db.events || []).forEach(function (e) {
      var hay = norm(e.title) + ' ' + norm(e.type) + ' ' + norm(e.note);
      if (hay.indexOf(q) < 0) return;
      var n = 0, sum = 0;
      (db.gifts || []).forEach(function (g) {
        if (g.eventId === e.id) { n++; sum += (g.direction === '收礼' ? 1 : -1) * (Number(g.amount) || 0); }
      });
      out.push({
        kind: 'event', score: 2,
        title: e.title || e.type, sub: e.type + ' · ' + ui.dateShort(e.date) + ' · ' + n + ' 笔',
        money: Math.round(sum * 100) / 100, arg: e.id, q: q
      });
    });

    // 3) 具体礼金记录（人名/备注/场合）
    (db.gifts || []).forEach(function (g) {
      var name = norm(g.person);
      // 人名已经在上面的「人物」里出过结果了，这里只在备注/场合命中时补
      var hay = norm(g.note) + ' ' + norm(g.occasion) + ' ' + norm(g.relation);
      if (hay.indexOf(q) < 0) return;
      var ev = g.eventId ? (db.events || []).filter(function (e) { return e.id === g.eventId; })[0] : null;
      out.push({
        kind: 'gift', score: 1,
        title: String(g.person || '') + ' ' + ui.money(g.amount),
        sub: ui.dateShort(g.date) + ' · ' + (g.occasion || '') + (g.note ? ' · ' + g.note : '') + (ev ? ' · ' + ev.title : ''),
        money: null, arg: g.id, q: q, gift: g
      });
    });

    out.sort(function (a, b) {
      if (a.score !== b.score) return b.score - a.score;
      return 0;
    });
    return out.slice(0, max);
  };

  /* ---------- 弹窗 ---------- */

  function open() {
    if (document.getElementById('modal-mask').classList.contains('open')) ui.closeModal();
    lastQuery = '';
    hits = [];

    ui.openModal({
      title: '',
      body:
        '<div class="search-input-row">' +
          '<span class="ico" aria-hidden="true">⌕</span>' +
          '<input id="sq" type="search" placeholder="搜人名、事件、备注…" autocomplete="off" spellcheck="false">' +
        '</div>' +
        '<div class="search-results" id="sr"><div class="search-empty">输入名字或关键词，边打边出结果</div></div>' +
        '<div class="search-tips"><span>↑↓ 选择</span><span>回车打开</span><span>Esc 关闭</span><span>⌘K 随时唤起</span></div>',
      onMount: function (box) {
        box.classList.add('search-modal');
        var input = box.querySelector('#sq');
        var list = box.querySelector('#sr');
        var sel = 0;
        setTimeout(function () { input.focus(); }, 40);

        function draw() {
          if (!lastQuery.trim()) {
            list.innerHTML = '<div class="search-empty">输入名字或关键词，边打边出结果</div>';
            return;
          }
          if (!hits.length) {
            list.innerHTML = '<div class="search-empty">没找到「' + ui.esc(lastQuery) + '」<br>' +
              '<span style="font-size:var(--fs-xs)">换个字试试，或者只打姓氏</span></div>';
            return;
          }
          list.innerHTML = hits.map(function (h, i) {
            var tag = h.kind === 'person' ? '人' : (h.kind === 'event' ? '事' : '账');
            var money = h.money === null ? '' :
              '<span class="amt ' + (h.money > 0 ? 'in' : h.money < 0 ? 'out' : '') + '">' +
              (h.money > 0 ? '+' : h.money < 0 ? '-' : '') + ui.money(Math.abs(h.money)).replace('¥', '') + '</span>';
            return '<div class="search-hit" data-i="' + i + '" aria-selected="' + (i === sel ? 'true' : 'false') + '">' +
              '<span class="hit-tag">' + tag + '</span>' +
              '<div class="hit-main"><div class="hit-t">' + highlight(h.title, h.q) + '</div>' +
              '<div class="hit-s">' + ui.esc(h.sub) + '</div></div>' + money + '</div>';
          }).join('');
        }

        function go(i) {
          var h = hits[i];
          if (!h) return;
          ui.closeModal();
          // 别让 hashchange 把带参数的路由冲掉
          if (h.kind === 'person') return APP.go('people', h.arg);
          if (h.kind === 'event') return APP.go('events', h.arg);
          if (h.kind === 'gift') return APP.openGiftEditor({ gift: h.gift });
        }

        input.addEventListener('input', function () {
          lastQuery = input.value;
          hits = SEARCH.run(store.load(), lastQuery);
          sel = 0;
          draw();
        });

        input.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (!hits.length) return;
            sel = (sel + 1) % hits.length; draw();
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (!hits.length) return;
            sel = (sel - 1 + hits.length) % hits.length; draw();
          } else if (e.key === 'Enter') {
            e.preventDefault();
            go(sel);
          }
        });

        list.addEventListener('click', function (e) {
          var row = e.target.closest('[data-i]');
          if (row) go(Number(row.getAttribute('data-i')));
        });
        list.addEventListener('mousemove', function (e) {
          var row = e.target.closest('[data-i]');
          if (!row) return;
          var i = Number(row.getAttribute('data-i'));
          if (i !== sel) { sel = i; draw(); }
        });
      }
    });
  }

  /* ---------- 快捷键 ---------- */

  document.addEventListener('keydown', function (e) {
    var k = e.key && e.key.toLowerCase();
    if ((e.metaKey || e.ctrlKey) && k === 'k') {
      e.preventDefault();
      open();
    }
  });

  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-search]')) { e.preventDefault(); open(); }
  });

  LB.SEARCH = SEARCH;
  LB.openSearch = open;
})();

</script>
<script>
/* js/app.js */
/* 礼簿 · 应用壳：路由、全局刷新、表单弹窗 */
(function () {
  'use strict';
  var LB = window.LB;
  var ui = LB.ui;
  var store = LB;
  var S = LB; // stats 与 store 都挂在 LB 上

  var app = {};
  var current = 'home';

  app.go = function (name, arg) {
    if (!LB.ui.pages[name]) name = 'home';
    current = name;
    Array.prototype.forEach.call(document.querySelectorAll('.view'), function (v) {
      v.classList.toggle('active', v.id === 'view-' + name);
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (b) {
      b.setAttribute('aria-selected', b.getAttribute('data-nav') === name ? 'true' : 'false');
    });
    var dock = document.getElementById('dock');
    if (dock) dock.style.display = (name === 'settings' || name === 'stats') ? 'none' : '';
    if (location.hash.slice(1) !== name) history.replaceState(null, '', '#' + name);
    app.render(name, arg);
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  };

  app.render = function (name, arg) {
    var page = LB.ui.pages[name || current];
    if (!page) return;
    var host = document.getElementById('view-' + (name || current));
    if (!host) return;
    // 每次渲染换一个干净节点：页面 mount 里绑的是委托监听，节点复用会让旧闭包一层层堆积
    var fresh = host.cloneNode(false);
    host.parentNode.replaceChild(fresh, host);
    host = fresh;
    var db = store.load();
    var gifts = db.gifts;
    try {
      host.innerHTML = page.render({ gifts: gifts, events: db.events, db: db, arg: arg });
    } catch (e) {
      // 页面算炸了也要让人看见，而不是留一块白
      host.innerHTML = '<div class="banner error">页面出错：' + ui.esc(e.message) +
        '<br><span style="font-size:12px;opacity:.7">' + ui.esc(String(e.stack || '').split('\n')[1] || '') + '</span></div>';
      throw e;
    }
    if (page.mount) page.mount(host, { gifts: gifts, events: db.events, db: db, arg: arg });
  };

  app.refresh = function () { app.render(current); };

  /* ---------- 礼金表单 ---------- */

  /**
   * @param {{gift?:object, eventId?:string, direction?:string, presetPerson?:string, onDone?:Function}} opt
   */
  app.openGiftEditor = function (opt) {
    opt = opt || {};
    var g = opt.gift || null;
    var db = store.load();
    var direction = g ? g.direction : (opt.direction || '收礼');
    var evOpts = '<option value="">不关联事件</option>' + db.events.map(function (e) {
      var sel = (g && g.eventId === e.id) || (!g && opt.eventId === e.id) ? ' selected' : '';
      return '<option value="' + ui.esc(e.id) + '"' + sel + '>' + ui.esc(e.title + ' · ' + ui.dateShort(e.date)) + '</option>';
    }).join('');

    var body =
      '<div class="field"><label>收 / 送</label>' + ui.segHTML('direction', LB.DIRECTIONS, direction) + '</div>' +
      '<div class="grid-2">' +
        '<div class="field"><label>人名</label><input class="input" id="f-person" placeholder="张三" value="' + ui.esc(g ? g.person : (opt.presetPerson || '')) + '" autocomplete="off"></div>' +
        '<div class="field"><label>金额（元）</label><input class="input num" id="f-amount" type="number" step="0.01" min="0" placeholder="800" value="' + (g ? g.amount : '') + '"></div>' +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="field"><label>关系</label><select class="select" id="f-relation">' + ui.optionsHTML(LB.RELATIONS, g ? g.relation : '朋友') + '</select></div>' +
        '<div class="field"><label>场合</label><select class="select" id="f-occasion">' + ui.optionsHTML(LB.OCCASIONS, g ? g.occasion : '结婚') + '</select></div>' +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="field"><label>日期</label><input class="input" id="f-date" type="date" value="' + ui.esc(g ? g.date : store.today()) + '"></div>' +
        '<div class="field"><label>关联事件</label><select class="select" id="f-event">' + evOpts + '</select></div>' +
      '</div>' +
      '<div class="field"><label>备注</label><input class="input" id="f-note" placeholder="微信红包 / 现金" value="' + ui.esc(g ? g.note : '') + '"></div>';

    ui.openModal({
      title: g ? '修改记录' : '记一笔',
      body: body,
      foot: (g ? '<button class="btn danger" data-del>删除</button>' : '') +
            '<button class="btn" data-modal-close>取消</button>' +
            '<button class="btn primary" data-save>' + (g ? '保存' : '记下') + '</button>',
      onMount: function (box) {
        var person = box.querySelector('#f-person');
        setTimeout(function () { person.focus(); }, 60);

        box.querySelector('[data-save]').addEventListener('click', function () {
          var name = person.value.trim();
          var amt = Number(box.querySelector('#f-amount').value);
          if (!name) { ui.toast('人名不能为空'); person.focus(); return; }
          if (!(amt > 0)) { ui.toast('金额要大于 0'); box.querySelector('#f-amount').focus(); return; }
          var payload = {
            person: name,
            amount: amt,
            direction: ui.segValue(box, 'direction') || '收礼',
            relation: box.querySelector('#f-relation').value,
            occasion: box.querySelector('#f-occasion').value,
            eventId: box.querySelector('#f-event').value || null,
            date: box.querySelector('#f-date').value || store.today(),
            note: box.querySelector('#f-note').value.trim()
          };
          if (g) store.updateGift(g.id, payload); else store.addGift(payload);
          ui.closeModal();
          ui.toast(g ? '已保存' : '已记下 ' + payload.person + ' ' + ui.money(payload.amount));
          app.afterChange(opt.onDone);
        });

        var del = box.querySelector('[data-del]');
        if (del) del.addEventListener('click', function () {
          ui.closeModal();
          ui.confirm('删除这条记录？', ui.esc(g.person) + ' · ' + ui.money(g.amount) + ' · ' + ui.dateShort(g.date) + '<br>删掉的记录会进回收站，' + store.TRASH_DAYS + ' 天内都能找回。', '删除').then(function (ok) {
            if (!ok) return;
            store.removeGift(g.id);
            ui.toast('已删除', {
              action: '撤销',
              onAction: function () {
                var back = store.undoLast();
                app.afterChange(opt.onDone);
                ui.toast(back ? '已撤销，记录回来了' : '没东西可撤了');
              }
            });
            app.afterChange(opt.onDone);
          });
        });

        // 回车直接提交，酒桌上单手操作更快
        box.querySelector('.modal-body').addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
            e.preventDefault();
            box.querySelector('[data-save]').click();
          }
        });
      }
    });
  };

  /* ---------- 事件表单 ---------- */

  app.openEventEditor = function (opt) {
    opt = opt || {};
    var e = opt.event || null;
    var body =
      '<div class="field"><label>事件类型</label><select class="select" id="e-type">' + ui.optionsHTML(LB.OCCASIONS, e ? e.type : '结婚') + '</select></div>' +
      '<div class="field"><label>事件名称</label><input class="input" id="e-title" placeholder="小明婚礼" value="' + ui.esc(e ? e.title : '') + '"></div>' +
      '<div class="grid-2">' +
        '<div class="field"><label>日期</label><input class="input" id="e-date" type="date" value="' + ui.esc(e ? e.date : store.today()) + '"></div>' +
        '<div class="field"><label>备注</label><input class="input" id="e-note" placeholder="地点或说明" value="' + ui.esc(e ? e.note : '') + '"></div>' +
      '</div>';

    ui.openModal({
      title: e ? '修改事件' : '新建事件',
      body: body,
      foot: (e ? '<button class="btn danger" data-del>删除事件</button>' : '') +
            '<button class="btn" data-modal-close>取消</button>' +
            '<button class="btn primary" data-save>保存</button>',
      onMount: function (box) {
        setTimeout(function () { box.querySelector('#e-title').focus(); }, 60);
        box.querySelector('[data-save]').addEventListener('click', function () {
          var payload = {
            type: box.querySelector('#e-type').value,
            title: box.querySelector('#e-title').value.trim() || box.querySelector('#e-type').value,
            date: box.querySelector('#e-date').value || store.today(),
            note: box.querySelector('#e-note').value.trim()
          };
          var row;
          if (e) row = store.updateEvent(e.id, payload); else row = store.addEvent(payload);
          ui.closeModal();
          ui.toast(e ? '已保存' : '事件已创建');
          app.afterChange(function () {
            if (!e) app.go('events', row.id); else app.refresh();
            if (opt.onDone) opt.onDone();
          });
        });
        var del = box.querySelector('[data-del]');
        if (del) del.addEventListener('click', function () {
          ui.closeModal();
          ui.confirm('删除这个事件？', '事件下的礼金记录会保留，只解除关联。<br>事件会进回收站，' + store.TRASH_DAYS + ' 天内都能找回。', '删除').then(function (ok) {
            if (!ok) return;
            store.removeEvent(e.id);
            ui.toast('事件已删除', {
              action: '撤销',
              onAction: function () {
                var back = store.undoLast();
                app.afterChange(function () { app.go('events'); });
                ui.toast(back ? '已撤销，事件回来了' : '没东西可撤了');
              }
            });
            app.afterChange(function () { app.go('events'); });
          });
        });
      }
    });
  };

  app.afterChange = function (cb) {
    if (cb) cb();
    app.refresh();
    // 首页的快照数字在别的页改完之后也得跟着走
    if (current !== 'home' && LB.ui.pages.home && LB.ui.pages.home.mount) app.render('home');
  };

  /* ---------- 启动 ---------- */

  function boot() {
    ui.bindGlobal();
    document.addEventListener('click', function (e) {
      var nav = e.target.closest('[data-nav]');
      if (nav) { e.preventDefault(); app.go(nav.getAttribute('data-nav')); return; }
      var act = e.target.closest('[data-action]');
      if (!act) return;
      var a = act.getAttribute('data-action');
      if (a === 'new-gift') { e.preventDefault(); app.openGiftEditor({}); }
      if (a === 'new-event') { e.preventDefault(); app.openEventEditor({}); }
    });

    // file:// 下 hash 路由是唯一不刷新页面的跳转方式
    window.addEventListener('hashchange', function () {
      var h = location.hash.slice(1) || 'home';
      if (h !== current) app.go(h);
    });

    var db = store.load();
    if (db.meta && db.meta.corrupt) {
      setTimeout(function () { ui.toast('本地数据读取失败，已按空账本启动'); }, 400);
    }
    app.go(location.hash.slice(1) || 'home');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  window.APP = app;
})();

</script>
